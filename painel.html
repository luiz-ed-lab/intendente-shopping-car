/* busca inteligente, a mesma do estoque do site: cada palavra procura em marca, modelo, versão, loja, câmbio e combustível, em qualquer
   ordem ("kwid auto barra" acha o Kwid da Auto Barra). Aceita erro de digitação, sigla sem hífen (hrv, tcross), apelido de marca (vw, gm),
   ano ("2020", "a partir de 2018") e limite de preço ou de km ("até 60 mil", "de 50 a 80 mil", "até 50 mil km") */
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const APELIDOS={vw:'volkswagen',volks:'volkswagen',gm:'chevrolet',chevy:'chevrolet',mb:'mercedes',merc:'mercedes',benz:'mercedes',automatica:'automatico',aut:'automatico',eletrica:'eletrico',hibrida:'hibrido'};
const VAZIAS=new Set(['de','da','do','das','dos','e','com','o','a','os','as','em','no','na','nos','nas','um','uma','pra','para','por','carro','carros','veiculo','veiculos','loja','ano','modelo','quero','procuro','reais','mil','km']);
function lerBusca(q){
  const lim={};let s=' '+norm(q).replace(/r\$/g,' ')+' ';
  const num=(n,mil)=>{const x=/^\d{1,3}(\.\d{3})+$/.test(n)?+n.replace(/\./g,''):parseFloat(n.replace(',','.'));return mil?x*1000:x;};
  const por=(x,km,lado)=>{if(!(x>=0))return;
    if(!km&&Number.isInteger(x)&&x>=1950&&x<=2039){lim['ano'+lado]=x;return;}   // 4 algarismos de ano: é o ano
    if(!km&&x<1000)x*=1000;   // "até 60" é 60 mil
    lim[(km?'km':'p')+lado]=x;};
  s=s.replace(/\sde\s+(\d[\d.,]*)\s*(mil|k)?\s+(?:a|ate)\s+(\d[\d.,]*)\s*(mil|k)?\s*(km)?(?=\s)/g,(m,a,ma,b,mb,km)=>{por(num(a,ma||mb),km,'min');por(num(b,mb),km,'max');return ' ';});
  s=s.replace(/\s(ate|abaixo de|menos de|no maximo|maximo|acima de|mais de|a partir de|apartir de|no minimo|minimo|desde)\s+(\d[\d.,]*)\s*(mil|k)?\s*(km)?(?=\s)/g,
    (m,op,n,mil,km)=>{por(num(n,mil),km,/ate|abaixo|menos|maximo/.test(op)?'max':'min');return ' ';});
  s=s.replace(/\s(\d[\d.,]*)\s*(mil|k)\s*(km)?(?=\s)/g,(m,n,mil,km)=>{por(num(n,mil),km,'max');return ' ';});   // "80 mil" sozinho: até 80 mil
  const toks=s.split(/\s+/).map(w=>w.replace(/^[^a-z0-9]+|[^a-z0-9]+$/g,'')).filter(w=>w&&!VAZIAS.has(w)).map(w=>APELIDOS[w]||w);
  return {toks,lim};
}
function parecida(a,b,k){   // no máximo k letras trocadas, a mais, a menos ou vizinhas invertidas
  if(Math.abs(a.length-b.length)>k)return false;
  let p2=null,p1=Array.from({length:b.length+1},(_,j)=>j);
  for(let i=1;i<=a.length;i++){const c=[i];let menor=i;
    for(let j=1;j<=b.length;j++){let x=Math.min(p1[j]+1,c[j-1]+1,p1[j-1]+(a[i-1]===b[j-1]?0:1));
      if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])x=Math.min(x,p2[j-2]+1);
      c[j]=x;if(x<menor)menor=x;}
    if(menor>k)return false;p2=p1;p1=c;}
  return p1[b.length]<=k;
}
function indiceBusca(v){   // palavras de cada anúncio, com o peso do lugar onde estão (guardado no próprio anúncio)
  if(v._bi)return v._bi;
  const pal=[],comp=[];
  [[v.marca,3],[v.modelo,4],[v.versao,1.5],[v.loja_nome,3],[v.cambio,1],[v.combustivel,1]].forEach(([t,p])=>{const n=norm(t);if(!n)return;
    n.split(/[\s\-\/()]+/).forEach(w=>{w=w.replace(/^[^a-z0-9]+|[^a-z0-9]+$/g,'');if(w)pal.push([w,p]);});
    comp.push([n.replace(/[^a-z0-9]/g,''),p]);});
  if(/autom|cvt|dct|dsg/.test(norm(v.cambio)))pal.push(['automatico',1]);
  return v._bi={pal,comp,anos:[v.ano_modelo,v.ano_fabricacao].filter(Boolean).map(String)};
}
function notaBusca(t,ix,exata){   // exata: sem aceitar erro de digitação
  if(/^(19[5-9]\d|20[0-3]\d)$/.test(t))return ix.anos.includes(t)?3:0;
  let m=0;const c=t.replace(/[^a-z0-9]/g,'');
  for(const [w,p] of ix.pal){
    if(w===t)m=Math.max(m,p);
    else if(t.length>1&&w.startsWith(t))m=Math.max(m,p*.8);
    else if(!exata&&c.length>3&&w.length>3&&parecida(c,w,c.length>6?2:1))m=Math.max(m,p*.55);
  }
  if(c.length>2)for(const [x,p] of ix.comp)if(x.includes(c))m=Math.max(m,p*.7);   // hrv, tcross, autobarra
  return m;
}
function buscarVeic(l,q,porNota){
  const {toks,lim}=lerBusca(q),ano=v=>Number(v.ano_modelo)||0,preco=v=>Number(v.preco)||0,km=v=>v.km==null?null:Number(v.km);
  l=l.filter(v=>(lim.pmax==null||preco(v)>0&&preco(v)<=lim.pmax)&&(lim.pmin==null||preco(v)>=lim.pmin)
    &&(lim.kmmax==null||km(v)!=null&&km(v)<=lim.kmmax)&&(lim.kmmin==null||km(v)>=lim.kmmin)
    &&(lim.anomax==null||ano(v)>0&&ano(v)<=lim.anomax)&&(lim.anomin==null||ano(v)>=lim.anomin));
  if(!toks.length)return l;
  const r=[];
  l.forEach((v,i)=>{const ix=indiceBusca(v),sc=toks.map(t=>notaBusca(t,ix));
    for(let j=0;j+1<toks.length;j++)if(!sc[j]||!sc[j+1]){const x=notaBusca(toks[j]+toks[j+1],ix,1);if(x)sc[j]=sc[j+1]=x/2;}   // "hb 20" é HB20
    let n=0,s=0;sc.forEach(x=>{if(x){n++;s+=x;}});if(n)r.push({v,n,s,i});});
  // os que têm todas as palavras; se nenhum tem, os mais parecidos: pelo menos metade das palavras e nota perto da melhor
  let f=r.filter(x=>x.n===toks.length);
  if(!f.length){const best=r.reduce((a,x)=>Math.max(a,x.s),0);f=r.filter(x=>x.n>=Math.ceil(toks.length/2)&&x.s>=best*.7);}
  if(porNota)f.sort((a,b)=>b.s-a.s||a.i-b.i);
  return f.map(x=>x.v);
}

// a foto sobe diminuída (no máximo 1600 px no lado maior, em webp): cabe no envio e o site carrega rápido. De arquivo ou de outra foto já lida
async function reduzirFoto(fonte,max,q){
  const url=typeof fonte==='string'?fonte:URL.createObjectURL(fonte);
  const img=await new Promise((ok,erro)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=erro;i.src=url;});
  const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');
  c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);if(typeof fonte!=='string')URL.revokeObjectURL(url);
  const d=c.toDataURL('image/webp',q);return d.startsWith('data:image/webp')?d:c.toDataURL('image/jpeg',q);   // navegador sem webp
}

  const titulo_=$('pTitulo').value.trim();
  if(!titulo_){toast('Escreva o título');$('pTitulo').focus();return;}
  const bt=$('pSalvar'),txt=bt.textContent;bt.disabled=true;bt.textContent='Salvando…';
  // o envio tem limite (cerca de 4 MB): as fotos novas diminuem mais um pouco se precisar
  const peso=()=>pubFotos.reduce((s,f)=>s+(f.nova?f.nova.length:0),0);
  if(peso()>4e6)for(const f of pubFotos)if(f.nova)f.nova=await reduzirFoto(f.nova,1280,.72);
  if(peso()>4e6){toast('São muitas fotos novas de uma vez: salve com menos e acrescente as outras depois');bt.disabled=false;bt.textContent=txt;return;}
  const pub={id:pubEdit||undefined,titulo:titulo_,categoria:pubCat,data:$('pData').value||hojeISO(),resumo:$('pResumo').value,texto:$('pTexto').value,destaque:pubDest};
  try{
    const r=await jsonPost('/api/publicacoes?path=publicacoes',{acao:'salvar',pub,fotos:pubFotos.map(f=>f.nova?{nova:f.nova}:{caminho:f.caminho})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.ok)throw new Error(j.erro||('erro '+r.status));
    // as fotos novas aparecem daqui até o site ser publicado de novo
    if(j.publicacao&&Array.isArray(j.publicacao.fotos))pubFotos.forEach((f,i)=>{if(f.nova&&j.publicacao.fotos[i])FOTO_LOCAL[j.publicacao.fotos[i]]=f.nova;});
    PUBS=j.publicacoes||PUBS;pubsErro=null;fecharPub();renderPubs();pintarResumo();
    toast('Publicação salva. O site atualiza em cerca de um minuto');
  }catch(e){toast('Não deu para salvar: '+e.message);bt.disabled=false;bt.textContent=txt;}
}
async function excluirPub(id){
  const p=PUBS.find(x=>x.id===id);if(!p||!confirm('Excluir a publicação "'+p.titulo+'"? Ela sai do site.'))return;
  try{
    const r=await jsonPost('/api/publicacoes?path=publicacoes',{acao:'excluir',id});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.ok)throw new Error(j.erro||('erro '+r.status));
    if(pubEdit===id)fecharPub();
    PUBS=j.publicacoes||PUBS.filter(x=>x.id!==id);renderPubs();pintarResumo();toast('Publicação excluída. O site atualiza em cerca de um minuto');
  }catch(e){toast('Não deu para excluir: '+e.message);}
}

/* ---------- busca do topo (associados, veículos, leads e publicações) ---------- */
function buscaGlobal(q){
  const pop=$('gPop');q=(q||'').trim();const n=norm(q);
  if(q.length<2){sumir(pop);return;}
  const out=[];
  entradasAssoc().filter(e=>norm(e.nome).includes(n)).slice(0,4).forEach(e=>out.push(`<button type="button" class="pi" onclick="fecharPops();${e.cred?`nav('associados',()=>{assocFiltro='todos';assocAberto='c:'+this.dataset.n;renderAssoc(true)})`:`verAssoc(${e.l.id})`}" data-n="${esc(e.nome)}"><b>${esc(e.nome)}</b><span>${e.cred?'Credenciado':'Associado · '+fmt(e.l.n)+' veículos'}</span></button>`));
  buscarVeic(veicAll,q,true).slice(0,5).forEach(v=>out.push(`<button type="button" class="pi" onclick="irBusca('veiculos',this.dataset.t)" data-t="${esc(q)}"><b>${esc(nomeV(v))} ${esc(v.ano_modelo||'')}</b><span>${precoV(v)} · ${esc(v.loja_nome||'')}</span></button>`));
  leads.filter(l=>norm(l.nome).includes(n)||(soDig(q).length>3&&soDig(l.tel).includes(soDig(q)))).slice(0,4).forEach(l=>out.push(`<button type="button" class="pi" onclick="verLead(${l.id})"><b>${esc(l.nome)}</b><span>Lead · ${tipoDe(l)[0]}</span></button>`));
  PUBS.filter(p=>norm(p.titulo).includes(n)).slice(0,3).forEach(p=>out.push(`<button type="button" class="pi" onclick="fecharPops();abrirPub('${p.id}')"><b>${esc(p.titulo)}</b><span>Mural · ${esc(p.categoria)}</span></button>`));
  pop.innerHTML=out.length?out.join(''):'<div class="pi"><span>Nada encontrado.</span></div>';
  if(!pop.classList.contains('on')){fecharAvisos();const r=$('buscaBox').getBoundingClientRect(),c=innerWidth<=760;
    pop.style.top=(r.bottom+8)+'px';pop.style.left=(c?12:r.left)+'px';pop.style.right=c?'12px':'auto';mostrar(pop);}
}
function irBusca(view,termo){
  fecharPops();$('gBusca').value='';
  nav(view,()=>{if(view==='veiculos'&&termo){limparFiltrosVeic(true);$('fVBusca').value=termo;VPAG=0;filtrarVeic();}});
}

/* ---------- menu: o nome da parte aberta e o da que está com o mouse em cima, como no site ---------- */
function abrirNomes(){
  const c=innerWidth<=760;
  document.querySelectorAll('#menu>a,#menu>button:not(.pgs)').forEach(b=>{
    const l=b.querySelector('.nl');if(!l)return;
    const on=b.classList.contains('on')||b.classList.contains('hov');
    l.style.width=c?'':(on?l.firstChild.scrollWidth+'px':'0px');
    l.classList.toggle('vis',c||on);b.classList.toggle('nome',!c&&on);
  });
}
// passar de uma para outra troca o nome aberto, sem fechar e abrir de novo; saindo da barra, fecha
function passarMenu(b){
  if(innerWidth<=760||!matchMedia('(hover:hover)').matches)return;
  let mudou=false;document.querySelectorAll('#menu>a,#menu>button:not(.pgs)').forEach(x=>{const h=x===b&&!x.classList.contains('on');if(x.classList.contains('hov')!==h){x.classList.toggle('hov',h);mudou=true;}});
  if(mudou)abrirNomes();
}
function toggleMenu(ev){ev.stopPropagation();const m=$('menu'),a=m.classList.toggle('aberto');$('menuBt').setAttribute('aria-expanded',a);}
function fecharMenu(){$('menu').classList.remove('aberto');$('menuBt').setAttribute('aria-expanded','false');}

/* ---------- navegação: tudo troca em fusão (a transição de página do navegador), também o topo; a data e o título têm a troca deles ---------- */
const VISTAS=['dash','associados','veiculos','leads','mural'],ANTIGAS={lojas:'associados',publicacoes:'mural'};
function nav(v,depois,semAnim){
  v=ANTIGAS[v]||v;if(!VISTAS.includes(v))v='dash';
  fecharPops();
  const de=vistaAtual;
  const troca=()=>{
    vistaAtual=v;
    // o cadastro e o editor do mural ficam no topo: saindo da parte deles, somem junto com a troca de página
    [['novoAssoc','associados'],['pubEd','mural']].forEach(([id,de_])=>{const b=$(id);if(v!==de_&&!b.hidden){b.hidden=true;b.innerHTML='';if(id==='pubEd')pubEdit=null;}});
    dica();
    document.querySelectorAll('#menu a[data-v]').forEach(a=>{const on=a.dataset.v===v;a.classList.toggle('on',on);a.classList.remove('hov');if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
    abrirNomes();
    document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));
    if(de!==v||primeiraVez){pintarHero(primeiraVez);primeiraVez=false;scrollTo(0,0);}
    $('menuBt').innerHTML=sv(IC[v]);setasVeic();
    try{history.replaceState(null,'','#'+v);}catch(e){}
    if(depois)depois();
  };
  if(de===v||semAnim||!document.startViewTransition||reduz()){troca();return;}
  const raiz=document.documentElement;if(scrollY>240)raiz.classList.add('vt-simples');   // longe do topo: só a fusão
  const t=document.startViewTransition(troca);
  t.finished.finally(()=>raiz.classList.remove('vt-simples'));
}
function abrirSecaoDoEndereco(){const alvo=(location.hash||'').replace('#','').replace(/[^a-z]/g,'');nav(VISTAS.includes(ANTIGAS[alvo]||alvo)?alvo:'dash',null,true);}
if(!document.startViewTransition)document.documentElement.classList.add('sem-vt');
document.addEventListener('click',e=>{
  if(!e.target.closest('#buscaBox')&&!e.target.closest('#gPop'))sumir($('gPop'));
  if(!e.target.closest('#avisos')&&!e.target.closest('#avisosBt'))fecharAvisos();
  if(!e.target.closest('#menu')&&!e.target.closest('#menuBt'))fecharMenu();
  if(!e.target.closest('.dd'))fecharDds();
});
// a busca e os avisos ficam presos à tela: rolando a página, fecham
addEventListener('scroll',()=>{sumir($('gPop'));fecharAvisos();},{passive:true});
addEventListener('resize',()=>{abrirNomes();setasVeic();});
document.fonts&&document.fonts.ready.then(abrirNomes);   // o nome medido com a letra do site, senão corta a última letra
document.addEventListener('keydown',e=>{if(e.key==='Escape')fecharPops();});
function toast(msg){const t=$('toast');t.innerHTML='<span class="ok">'+check+'</span>'+esc(msg);t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3800);}

/* ---------- entrada: a saudação da hora e o arco do dia ---------- */
const SEMANA=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'],
  MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
// medidas do desenho no computador e no celular (as dos exemplos): o arco, o sol (a: disco, b: brilho) e os rótulos das pontas
const ARCO={pc:{w:760,h:400,cx:380,cy:370,r:350,a:9,b:22,f:13,ty:396},cel:{w:350,h:214,cx:175,cy:193,r:175,a:7,b:16,f:11,ty:211}};   // no celular, as pontas nas bordas
const telaArco=()=>innerWidth<=760?'cel':'pc';
function montarArco(){
  const s=$('arco'),k=telaArco(),g=ARCO[k];
  s.dataset.g=k;s.setAttribute('viewBox',`0 0 ${g.w} ${g.h}`);
  s.innerHTML=`<defs><mask id="lua"><circle r="${g.a}" fill="#fff"/><circle r="${g.a*.82}" cx="${g.a*.48}" cy="${-g.a*.36}" fill="#000"/></mask></defs>
    <path class="trilho" d="M${g.cx-g.r} ${g.cy}A${g.r} ${g.r} 0 0 1 ${g.cx+g.r} ${g.cy}"/><path class="feito"/>
    <g class="astro"><circle class="brilho" r="${g.b}"/><circle class="disco" r="${g.a}"/></g>
    <text x="${g.cx-g.r}" y="${g.ty}" font-size="${g.f}"></text><text x="${g.cx+g.r}" y="${g.ty}" font-size="${g.f}"></text>`;
}
// f: quanto do caminho já foi (0 na ponta da esquerda, 1 na da direita). De dia, das 6h às 18h; de noite, das 18h às 6h, com a lua
function pintarArco(f,noite){
  const s=$('arco'),g=ARCO[s.dataset.g],ang=Math.PI*Math.min(Math.max(f,0),.9999),
    x=(g.cx-g.r*Math.cos(ang)).toFixed(1),y=(g.cy-g.r*Math.sin(ang)).toFixed(1),[t1,t2]=s.querySelectorAll('text');
  s.classList.toggle('noite',noite);
  s.querySelector('.feito').setAttribute('d',`M${g.cx-g.r} ${g.cy}A${g.r} ${g.r} 0 0 1 ${x} ${y}`);
  s.querySelector('.astro').setAttribute('transform',`translate(${x} ${y})`);
  const d=s.querySelector('.disco');if(noite)d.setAttribute('mask','url(#lua)');else d.removeAttribute('mask');
  t1.textContent=noite?'18h':'6h';t2.textContent=noite?'6h':'18h';
}
// a saudação, a data e a hora de agora; devolve onde o sol (ou a lua) está no arco
function relogio(){
  const d=new Date(),h=d.getHours(),m=d.getMinutes(),t=h+m/60,noite=t<6||t>=18;
  $('saud').innerHTML=h<5||h>=18?'Boa <em>noite.</em>':h<12?'Bom <em>dia.</em>':'Boa <em>tarde.</em>';
  $('entData').textContent=SEMANA[d.getDay()]+', '+d.getDate()+' de '+MESES[d.getMonth()];
  $('entHora').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
  $('entAno').textContent=d.getFullYear();
  return {f:noite?((t+6)%24)/12:(t-6)/12,noite};
}
// abrindo a entrada, o sol sai da ponta do arco e anda até a hora de agora; depois acompanha o relógio
function mostrarEntrada(){
  montarArco();
  const a=relogio(),ini=performance.now(),dur=matchMedia('(prefers-reduced-motion: reduce)').matches?0:1600;
  const passo=agora=>{const k=dur?Math.min(1,(agora-ini)/dur):1;pintarArco(a.f*(1-Math.pow(1-k,3)),a.noite);if(k<1)requestAnimationFrame(passo);};
  requestAnimationFrame(passo);
  clearInterval(mostrarEntrada.t);mostrarEntrada.t=setInterval(()=>{const b=relogio();pintarArco(b.f,b.noite);},15000);
}
addEventListener('resize',()=>{if(mostrarEntrada.t&&$('arco').dataset.g!==telaArco()){montarArco();const b=relogio();pintarArco(b.f,b.noite);}});
function verSenha(){
  const i=$('lpass'),b=$('lolho'),mostrando=i.type==='text';
  i.type=mostrando?'password':'text';b.title=mostrando?'Mostrar senha':'Ocultar senha';b.setAttribute('aria-label',b.title);
  b.innerHTML=mostrando?'<svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>'
    :'<svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.7 5.1A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7a18 18 0 0 1-2.7 3.7"/><path d="M6.6 6.6A17.8 17.8 0 0 0 2 12s3.6 7 10 7a10.7 10.7 0 0 0 5.4-1.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="m2 2 20 20"/></svg>';
  i.focus();
}
// a senha é conferida só no servidor (PAINEL_TOKEN). Sem a senha configurada no servidor, o painel não abre
async function entrar(){
  const p=$('lpass').value,err=$('lerr');
  let ok=false,protegido=true;
  try{const r=await fetch('/api/auth?path=auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:p})});
    const j=await r.json().catch(()=>({}));ok=!!j.ok;protegido=j.protegido!==false;}catch(e){ok=false;}
  if(ok&&protegido){err.style.display='none';salvarSessao(p);abrirPainel(p);return;}
  err.textContent=ok?'A senha do painel não está configurada no servidor.':'Senha incorreta.';err.style.display='block';
}
function abrirPainel(token){
  PAINEL_TOKEN=token;
  clearInterval(mostrarEntrada.t);mostrarEntrada.t=0;
  $('login').style.display='none';$('app').classList.add('on');
  abrirSecaoDoEndereco();pintarRel();carregarPainel();
  const s=lerSessao();
  if(s)setTimeout(()=>{alert('A sessão terminou. Entre de novo.');sair();},Math.max(1000,s.exp-Date.now()));
}
/* sessão de 1 hora: ainda valendo, entra direto */
(function(){const s=lerSessao();if(s&&s.t)abrirPainel(s.t);else{mostrarEntrada();setTimeout(()=>$('lpass').focus(),100);}})();
</script>
