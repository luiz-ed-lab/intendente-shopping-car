<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel Aceima</title>
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="32x32" href="marca-nova/icone-32.png">
<link rel="apple-touch-icon" href="marca-nova/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Painel da Aceima (refeito em 16/10/2026, a opção 2 que o Luiz escolheu): o topo azul com o vidro, como as páginas do site, a logo no
   meio e, embaixo, a folha clara que sobe por cima dele. O menu é a mesma barra em pílula do site, fixa embaixo; no celular, o botão do
   canto abre a lista. Cores, letras e botões são os do site (Outfit nos títulos, Figtree nos textos) */
:root{--navy:#00091A;--navy2:#0A1A33;--ink:#0B1A33;--cl:#F6F4F1;--gold:#C8862E;--gold2:#E8A048;--gold3:#F4B05C;--goldtx:#9A5F14;
  --mut:#5A6B85;--clara:#B9C6DA;--line:#E3DFDA;--line2:#ECE7E1;--f1:Outfit,sans-serif;--f2:Figtree,sans-serif;
  --canto:44px;--lado:60px;--ease:cubic-bezier(.2,.8,.2,1);--sombra:0 1px 0 rgba(11,26,51,.04),0 16px 36px -26px rgba(11,26,51,.32)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow-x:clip){html,body{overflow-x:clip}}
body{font-family:var(--f2);background:var(--cl);color:var(--ink);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit;text-align:inherit}
input,select,textarea{font-family:inherit;outline:none;color:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{font-family:var(--f1);font-weight:500;letter-spacing:-.02em}
.ic{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.ic.sm{width:16px;height:16px}
.kk{font:600 11.5px/1.2 var(--f2);letter-spacing:.22em;text-transform:uppercase}
.mut{color:var(--mut)}
.so-leitor{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* o vidro do site, parado: o quadro do vídeo do fundo, discreto como no site */
.vidro{position:relative;background:var(--navy);isolation:isolate}
.vidro::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:url(fundo-animado-frame.jpg) center/cover no-repeat;opacity:.17;mix-blend-mode:screen;filter:brightness(.78)}

/* ===== botões ===== */
.bt{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 22px;border-radius:99px;background:var(--gold2);color:var(--navy);font:600 14.5px/1 var(--f2);white-space:nowrap;transition:background .2s,box-shadow .2s}
.bt:hover{background:var(--gold3)}
.bt.az{background:var(--navy);color:#fff}.bt.az:hover{background:#10264A}
.bt.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}.bt.ghost:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.bt.sm{height:38px;padding:0 15px;font-size:13.5px;gap:8px}
.bt:disabled{opacity:.55;cursor:default}
.ib{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--mut);background:#fff;box-shadow:inset 0 0 0 1px var(--line);transition:color .2s,box-shadow .2s}
.ib:hover{color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ib.perigo:hover{color:#9A2F22;box-shadow:inset 0 0 0 1px #9A2F22}
.lk{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--ink);transition:color .2s}
.lk:hover{color:var(--gold)}

/* ===== entrada (a opção 4 que o Luiz escolheu, 20/10/2026): a saudação da hora, com o sol no arco do dia, das 6h às 18h (de noite, a
   lua faz o mesmo caminho, das 18h às 6h). A data e a hora ficam alinhadas com o campo da senha e o botão: a data começa na borda do
   campo e a hora termina na borda do botão. No celular, como no computador, a saudação fica dentro do arco, e as pontas do arco, a data
   e a hora, o campo e o botão (menores, lado a lado) ficam alinhados dos dois lados (pedido do Luiz, 20/10/2026) ===== */
#login{position:fixed;inset:0;z-index:200;overflow:auto;color:#fff}
.ent{min-height:100%;max-width:1240px;margin:0 auto;padding:40px var(--lado) 34px;display:flex;flex-direction:column}
.ent-topo{display:flex;align-items:center;justify-content:space-between;gap:20px}
.ent-topo img{height:30px;width:auto}
.ent-volta{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--clara);transition:color .2s,background .2s}
.ent-volta:hover{color:var(--gold3)}
.ent-volta .ext{display:none}
.ent-meio{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 0 80px;   /* no computador, tudo um pouco acima do meio */
  --arco:min(760px,100%,max(440px,calc((100vh - 352px)*1.9)))}
/* o desenho: a saudação fica dentro do arco, apoiada na linha das pontas; numa tela baixa, o arco diminui para tudo caber */
.dia{position:relative;width:var(--arco);aspect-ratio:760/400;container-type:inline-size}
.dia svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dia .trilho{fill:none;stroke:rgba(255,255,255,.16);stroke-width:1.5;vector-effect:non-scaling-stroke}
.dia .feito{fill:none;stroke:var(--gold2);stroke-width:2;stroke-linecap:round;vector-effect:non-scaling-stroke}
.dia .brilho{fill:rgba(244,176,92,.18);animation:brilha 3s ease-in-out infinite}
.dia .disco{fill:var(--gold3)}
.dia text{fill:#8592AA;font-family:var(--f2);text-anchor:middle}
.dia .noite .feito{stroke:rgba(185,198,218,.55)}
.dia .noite .brilho{fill:rgba(220,228,240,.13)}
.dia .noite .disco{fill:#E6ECF5}
@keyframes brilha{50%{opacity:.55}}
.saud{position:absolute;left:0;right:0;bottom:3.6%;text-align:center}
.saud .kk{color:var(--gold3)}
.saud h1{margin-top:10px;font:300 112px/1 var(--f1);font-size:min(112px,14.74cqw);letter-spacing:-.04em}
.saud h1 em{font-style:italic;font-weight:400;color:var(--gold3)}
.ent-form{width:min(540px,calc(var(--arco) * 700 / 760));margin-top:30px}   /* nunca mais larga que as pontas do arco */
.ent-hora{display:flex;justify-content:space-between;gap:16px;font-size:15px;line-height:20px;color:var(--clara)}
.ent-hora b{font-weight:500;color:#fff;font-variant-numeric:tabular-nums}
.ent-linha{display:flex;gap:10px;margin-top:12px}
.ent .campo{position:relative;flex:1}
.ent input{width:100%;height:54px;padding:0 54px 0 22px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);color:#fff;font-size:15px;transition:border-color .2s}
.ent input::placeholder{color:#8592AA}
.ent input:focus{border-color:rgba(244,176,92,.65)}
.olho{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;color:var(--clara);display:flex;align-items:center;justify-content:center}
.olho:hover{color:#fff;background:rgba(255,255,255,.08)}
.ent-linha .bt{height:54px;padding:0 28px;font-size:15px}
#lerr{display:none;margin-top:12px;color:#F7A89B;font-size:13.5px;font-weight:600}
.ent-rod{text-align:center;font-size:12px;line-height:1.5;color:#8592AA}
@media (max-width:760px){
  .ent{padding:22px 20px 18px}
  .ent-topo img{height:22px}
  .ent-volta{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.08);color:#fff;justify-content:center}
  .ent-volta:hover{color:#fff;background:rgba(255,255,255,.15)}
  .ent-volta span,.ent-volta .vol{display:none}
  .ent-volta .ext{display:block}
  .ent-meio{padding:20px 0}
  /* o arco vai de uma borda à outra, na largura da data e da hora e da linha do campo com o botão */
  .dia{width:100%;aspect-ratio:350/214}
  .saud{bottom:6.4%}
  .saud .kk{font-size:10.5px}
  .saud h1{margin-top:6px;font-size:16cqw}
  .ent-form{width:100%;margin-top:22px}
  .ent-hora{font-size:13px;line-height:18px}
  .ent-linha{gap:8px;margin-top:10px}
  .ent input{height:42px;padding:0 42px 0 16px;font-size:13.5px}
  .olho{right:3px;width:36px;height:36px}
  .ent-linha .bt{height:42px;padding:0 18px;font-size:13.5px}
  #lerr{margin-top:10px;font-size:12.5px}
  .ent-rod{font-size:11px}
}

/* ===== topo azul ===== */
/* o botão principal com o dourado do site, em degradê */
.bt{background:linear-gradient(135deg,#C8862E,#F0AD57)}
.bt:not(.az):not(.ghost):hover{background:linear-gradient(135deg,#D3913A,#F5B866)}
.app{display:none}.app.on{display:block}
.topo{color:#fff;padding:24px var(--lado) calc(var(--canto) + 52px)}
/* a mesma largura das páginas do site (.wrap do site: até 1780 px, com 60 px de cada lado): o painel vai até as bordas como elas
   (pedido do Luiz, 20/10/2026: antes ficava numa coluna de 1320 px no meio da tela) */
.topo-in{max-width:1660px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;grid-template-areas:"busca logo acoes" "tit tit tit" "form form form" "kpi kpi kpi" "graf graf graf";align-items:center;column-gap:20px}
.busca{grid-area:busca;justify-self:start;display:flex;align-items:center;gap:10px;width:300px;height:44px;padding:0 16px;border-radius:99px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);color:var(--clara)}
.busca input{flex:1;min-width:0;border:0;background:none;color:#fff;font-size:14px}
.busca input::placeholder{color:#8592AA}
.tlogo{grid-area:logo;height:34px;width:auto}
.tacoes{grid-area:acoes;justify-self:end;display:flex;align-items:center;gap:10px}
.cir{position:relative;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;justify-content:center;transition:background .2s}
.cir:hover,.cir.on{background:rgba(255,255,255,.16)}
.cir .num{position:absolute;top:1px;right:-2px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--gold2);color:var(--navy);font:700 11px/19px var(--f2);text-align:center;box-shadow:0 0 0 2px var(--navy)}
.uchip{display:flex;align-items:center;gap:10px;height:44px;padding:0 5px;border-radius:99px;background:rgba(255,255,255,.08)}
.uchip .av{width:34px;height:34px;border-radius:50%;background:var(--gold2);color:var(--navy);display:flex;align-items:center;justify-content:center;font:600 14px/1 var(--f1)}
.uchip b{font-size:14px;font-weight:600}
.uchip button{width:34px;height:34px;border-radius:50%;color:var(--clara);display:flex;align-items:center;justify-content:center}
.uchip button:hover{color:#fff}
.menuBt{display:none}
/* o título de cada parte: na visão geral, a data grande; nas outras, a data pequena em cima e o nome da parte embaixo (pedido do Luiz,
   20/10/2026). Trocando de parte, a data diminui e sobe (ou cresce, voltando) e o nome da parte surge: é a transição de página do
   navegador, com nomes próprios para a data e o título (data-topo e titulo-pg). A caixa da data abraça o texto, para a troca não esticar */
.htit{grid-area:tit;margin-top:56px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px}
.htit .kk{display:block;width:max-content;max-width:100%;color:var(--gold3)}
.htit h1{font:500 58px/1.05 var(--f1);letter-spacing:-.02em}
.htit h1.data{width:max-content;max-width:100%}
.htit .kk+h1{margin-top:14px}
.htit h1 em{font-style:italic;color:var(--gold3)}
/* na visão geral, a data fica no meio (pedido do Luiz, 20/10/2026) */
.htit.centro{justify-content:center;text-align:center}
.htit.centro h1.data{margin:0 auto}
.htit.centro .hero-ac{display:none}
.hres{margin-top:12px;font-size:15px;color:var(--clara)}
.hres b{color:#fff;font-weight:600}
.lnk-erro{color:#F5A193;font-weight:600;transition:color .2s}
.lnk-erro:hover{color:#FFC6BD}
/* os quatro números da visão geral, sem as linhas entre eles, e alinhados com as bordas: o primeiro encosta na da esquerda, o último na da
   direita, e os do meio ficam no meio (pedidos do Luiz, 20/10/2026) */
.hkpi{grid-area:kpi;margin-top:48px;display:flex;justify-content:space-between;gap:24px 32px}
.hkpi[hidden]{display:none}
.hkpi>div{min-width:0;text-align:center}
.hkpi>div:first-child{text-align:left}
.hkpi>div:last-child{text-align:right}
.hkpi .n{min-height:1em;font:500 64px/1 var(--f1);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hkpi .n.ouro{color:var(--gold3)}
.hkpi .r{min-height:1.5em;margin-top:12px;font-size:15px;font-weight:600}
.hkpi .s{min-height:1.5em;margin-top:4px;font-size:13.5px;color:var(--clara)}
/* escrita: cada letra entra em fusão, uma depois da outra (o atraso vem em cada letra) */
.lt{animation:letra .22s ease-out both}
@keyframes letra{from{opacity:0}}
/* ===== visitas ao site: os gráficos da visão geral, no azul, embaixo dos quatro números (pedido do Luiz, 21/10/2026). Marcas finas no
   dourado do site, grade discreta, o valor escrito na ponta das barras; na linha e nas colunas, o valor aparece com o mouse em cima ===== */
.hgraf{grid-area:graf;margin-top:60px}
.hgraf[hidden]{display:none}
.gf-cab{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.gf-cab .kk{color:var(--gold3)}
.gf-per{display:flex;gap:4px;padding:4px;border-radius:99px;background:rgba(255,255,255,.06)}
.gf-per button{height:32px;padding:0 14px;border-radius:99px;color:#B9C6DA;font:600 12.5px/1 var(--f2);transition:background .2s,color .2s}
.gf-per button:hover{color:#fff}
.gf-per button.on{background:#fff;color:var(--ink)}
.gf-grade{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;transition:opacity .25s}
.gf-grade.carrega{opacity:.45}   /* trocando o período, os gráficos ficam apagados até os números novos chegarem */
.gc{min-width:0;padding:22px 24px 24px;border-radius:22px;background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.gc-dia{grid-column:span 4}
.gc-tempo,.gc-carros,.gc-origem,.gc-hora{grid-column:span 2}
.gc-busca,.gc-lojas{grid-column:span 3}
.gc h3{font:500 17px/1.25 var(--f1);letter-spacing:-.01em}
.gc .gsub{margin-top:3px;font-size:13px;color:#8592AA}
.gc .gvazio{margin-top:18px;font-size:13.5px;color:#8592AA}
.gtopo{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 30px}
.gnum{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:12px}
.gnum b{font:500 42px/1 var(--f1);letter-spacing:-.03em}
.gnum span{font-size:14px;color:#B9C6DA}
.gdelta{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:99px;font:600 12px/1 var(--f2);white-space:nowrap}
.gdelta.sobe{background:rgba(119,201,160,.14);color:#8FD6B0}
.gdelta.desce{background:rgba(245,161,147,.13);color:#F5A193}
.gdelta.igual{background:rgba(255,255,255,.07);color:#B9C6DA}
.gmini{display:flex;flex-wrap:wrap;gap:8px 28px;font-size:12.5px;color:#8592AA}
.gmini b{display:block;margin-bottom:3px;font:500 20px/1.1 var(--f1);color:#fff}
/* a linha das visitas por dia e as colunas do horário: SVG do tamanho da caixa, desenhado de novo quando a tela muda */
.gplot{position:relative;margin-top:18px;height:210px;touch-action:pan-y}
/* a linha e as colunas ocupam a altura que sobra no cartão (a fileira tem a altura do cartão mais alto) */
.gc-dia,.gc-hora{display:flex;flex-direction:column}
.gc-dia .gplot,.gc-hora .gplot{flex:1 1 auto;height:auto;min-height:210px}
.gplot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.gplot .grade{stroke:rgba(255,255,255,.08);stroke-width:1;shape-rendering:crispEdges}
.gplot .eixo{fill:#8592AA;font:500 11.5px var(--f2)}
.gplot .area{fill:url(#gArea)}
.gplot .linha{fill:none;stroke:var(--gold3);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.gplot .rev{clip-path:inset(0 100% 0 0);transition:clip-path 1.3s cubic-bezier(.2,.8,.2,1)}
.gplot .rev.on{clip-path:inset(0 0 0 0)}
.gplot .mira{stroke:rgba(255,255,255,.4);stroke-width:1}
.gplot .ponto{fill:var(--gold3);stroke:#00091A;stroke-width:2}
.gplot .col{fill:url(#gCol);transition:opacity .2s}
.gplot .col.fora{opacity:.4}
.gplot.cols .col{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .2s}
.gplot.cols.on .col{transform:none}
.gplot:focus-visible{outline:2px solid var(--gold3);outline-offset:6px;border-radius:8px}
/* barras: o nome, o valor na ponta e a barra embaixo (quadrada na base, redonda na ponta) */
.gbar{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:12px;row-gap:6px;margin-top:13px}
.gbar>span{min-width:0;font-size:13.5px;color:#CFD9E8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbar>b{font:600 13px/1 var(--f2);color:#fff;font-variant-numeric:tabular-nums}
.gbar>b small{margin-left:6px;font-weight:500;color:#8592AA}
.gbar>i{grid-column:1/-1;height:6px;border-radius:0 3px 3px 0;background:rgba(255,255,255,.07)}
.gbar>i>u{display:block;height:100%;width:0;border-radius:0 3px 3px 0;background:linear-gradient(90deg,#C8862E,#F0AD57);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.gfim{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08);font-size:13px;color:#B9C6DA}
.gfim b{color:#fff;font-weight:600}
/* os carros mais visitados: a foto, o nome, a loja e a barra; tocado, abre o carro em Veículos */
.gcar{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:12px;align-items:center;width:calc(100% + 16px);margin:10px -8px 0;padding:6px 8px;border-radius:14px;text-align:left;transition:background .2s}
.gcar:hover{background:rgba(255,255,255,.05)}
.gcar .ft{width:60px;aspect-ratio:4/3;border-radius:9px;background:#0A1A33 center/cover no-repeat}
.gcar .nm{min-width:0}
.gcar .nm b{display:block;font:500 14px/1.25 var(--f1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcar .nm small{display:block;margin-top:2px;font-size:12px;color:#8592AA;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcar .nm i{display:block;margin-top:7px;height:4px;border-radius:0 3px 3px 0;background:rgba(255,255,255,.07)}
.gcar .nm i u{display:block;height:100%;width:0;border-radius:0 3px 3px 0;background:linear-gradient(90deg,#C8862E,#F0AD57);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.gcar>b{font:600 15px/1 var(--f1);text-align:right}
.gcar>b small{display:block;margin-top:3px;font:500 11px/1 var(--f2);color:#8592AA}
/* o aparelho: uma barra só, dividida, com a legenda embaixo */
.gap-t{display:flex;gap:2px;height:10px;margin-top:12px}
.gap-t i{display:block;min-width:2px;height:100%;border-radius:2px;flex:0 0 0;transition:flex-grow 1s cubic-bezier(.2,.8,.2,1)}
.gleg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12.5px;color:#CFD9E8}
.gleg span{display:inline-flex;align-items:center;gap:6px}
.gleg i{width:10px;height:10px;border-radius:3px}
.gleg b{color:#fff;font-weight:600}
.gtip{position:fixed;z-index:400;pointer-events:none;padding:10px 12px;border-radius:12px;background:#fff;color:var(--ink);box-shadow:0 18px 40px -16px rgba(0,9,26,.6);font-size:12.5px;line-height:1.35;white-space:nowrap}
.gtip[hidden]{display:none}
.gtip b{display:block;font:600 16px/1.2 var(--f1)}
.gtip span{display:block;color:var(--mut)}
/* o cadastro de um associado e o editor do mural abrem no azul do topo, acima da folha clara (pedido do Luiz, 21/10/2026) */
.tform{grid-area:form;margin-top:40px}
.tform[hidden]{display:none}
.tf-cab{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.tf-cab .kk{color:var(--gold3)}
.na-g{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) auto;gap:18px 20px;align-items:end}
.na-g .cm-b{margin:0;flex-wrap:nowrap}
.na-g .cm-b .bt,.na-g .cm-b .bto{height:48px}
.tform .cps{margin-top:0}
.tform .falta,.tform .and,.tform .ok-n{margin-top:22px}
.tform .falta+.cps{margin-top:18px}
/* a lista suspensa no azul (o ramo do cadastro), escura como a do site */
.dd.esc{display:block}
.dd.esc .dd-t{width:100%;height:48px;border-radius:12px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);color:#fff;font-size:14.5px;font-weight:400}
.dd.esc .dd-t:hover{box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.dd.esc.on .dd-t{box-shadow:inset 0 0 0 1px rgba(244,176,92,.65)}
.dd-p.esc{background:#0E1E38;color:#fff;box-shadow:0 22px 50px -18px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.1)}
.dd-p.esc .dd-o:hover{background:rgba(255,255,255,.07)}
.dd-p.esc .dd-o.sel{color:var(--gold3)}
.dd-p.esc::-webkit-scrollbar-thumb{background-color:rgba(255,255,255,.2)}
/* busca e avisos: ficam fora do topo, presos à tela e por cima da folha clara (dentro do topo, ficavam atrás dela) */
.pop{position:fixed;z-index:210;width:340px;max-height:60vh;overflow:auto;padding:8px;border-radius:20px;background:#fff;color:var(--ink);box-shadow:0 24px 60px -20px rgba(0,9,26,.5),0 0 0 1px rgba(11,26,51,.05);display:none;text-align:left}
.pop.on{display:block;animation:dropEntra .2s var(--ease) both}
/* fechando, a busca e os avisos somem em fusão, como abrem (pedido do Luiz, 21/10/2026) */
.pop.sai,.avisos.sai{display:block;animation:dropSai .18s ease-in both;pointer-events:none}
.pop .ph{padding:10px 12px 6px;font:600 11px/1 var(--f2);letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.pop .pi{display:block;width:100%;padding:10px 12px;border-radius:12px;text-align:left}
.pop button.pi:hover{background:#F4F1EC}
.pop .pi b{display:block;font-size:14px;font-weight:600}
.pop .pi span{display:block;margin-top:2px;font-size:12.5px;color:var(--mut)}
.avisos{position:fixed;z-index:210;width:380px;max-height:min(72vh,600px);overflow:auto;border-radius:26px;background:#fff;color:var(--ink);box-shadow:0 30px 70px -24px rgba(0,9,26,.55),0 0 0 1px rgba(11,26,51,.05);display:none;transform-origin:top right}
.avisos.on{display:block;animation:dropEntra .22s var(--ease) both}
.av-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:22px 24px 6px}
.av-h b{font:500 22px/1.1 var(--f1);letter-spacing:-.02em}
.av-h span{font-size:13px;color:var(--mut)}
.av-g{padding:4px 10px 8px}
.av-g+.av-g{border-top:1px solid var(--line2)}
.av-t{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 6px;font:600 11px/1 var(--f2);letter-spacing:.16em;text-transform:uppercase;color:var(--goldtx)}
.av-t button{font:600 12.5px/1 var(--f2);letter-spacing:0;text-transform:none;color:var(--mut)}
.av-t button:hover{color:var(--ink)}
.av-i{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;border-radius:16px;text-align:left;transition:background .2s}
.av-i:hover{background:#F4F1EC}
.av-i .tx{flex:1;min-width:0}
.av-i b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av-i small{display:block;margin-top:2px;font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av-i time{flex:none;font-size:12px;color:var(--mut)}
.av-i.erro small{color:#9A2F22}
.av-ok{display:flex;align-items:center;gap:12px;padding:10px 24px 26px;color:var(--mut);font-size:14px}
.av-ok i{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:#E0F0E8;color:#1F6146}

/* ===== folha clara ===== */
/* a folha tem pelo menos a altura da tela: a página sempre rola, e a barra de rolagem não some numa lista curta (sumindo, tudo andava para
   o lado ao escolher um filtro; pedido do Luiz, 21/10/2026) */
.folha{position:relative;margin-top:calc(-1 * var(--canto));padding:52px var(--lado) 140px;border-radius:var(--canto) var(--canto) 0 0;background:var(--cl);min-height:100vh}
.wrap{max-width:1660px;margin:0 auto}
.view{display:none}
.view.on{display:block}
.sem-vt .view.on{animation:entra .35s var(--ease)}   /* navegador sem a transição de página: só a folha entra */
@keyframes entra{from{opacity:0;transform:translateY(8px)}}
.sh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 16px;margin-bottom:18px}
.sh h2{font:400 30px/1.1 var(--f1)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(460px,100%),1fr));gap:48px 56px}
.vazio{padding:22px 0;color:var(--mut);border-top:1px solid var(--line)}
/* linhas das listas da visão geral */
.row{display:flex;align-items:center;gap:14px;width:100%;padding:11px 0;border-top:1px solid var(--line);text-align:left}
.row-tx{flex:1;min-width:0}
.row-tx b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .2s}
.row-tx small{display:block;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.row:hover .row-tx b{color:var(--gold)}
.row-q{width:62px;flex:none;text-align:right;font-size:13px;color:var(--mut)}
.row-n{width:96px;flex:none;text-align:right;font-size:13px;color:var(--mut)}
.row-n b{font:500 18px/1 var(--f1);color:var(--ink)}
.row-st{min-width:96px;flex:none;display:flex;justify-content:flex-end}
.tp{font-weight:600;color:var(--goldtx)}
.av{width:38px;height:38px;border-radius:50%;background:#E9E4DD;color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none;font:600 13px/1 var(--f2)}
/* a entrada da visão geral: as linhas chegam uma depois da outra */
.chega{animation:entra .45s var(--ease) backwards}
/* etiquetas */
.pl{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;font:600 12.5px/1 var(--f2);white-space:nowrap}
.pl::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pl.sem::before{display:none}
.pl.novo,.pl.ouro{background:#FBEBD5;color:#8A5410}.pl.ok{background:#E0F0E8;color:#1F6146}
.pl.cinza{background:#ECEAE7;color:#5F5A55}.pl.erro{background:#F8E1DE;color:#9A2F22}
.tpp{display:inline-flex;align-items:center;padding:5px 10px;border-radius:99px;font:600 12px/1 var(--f2);white-space:nowrap}
.tp-venda{background:#E2E9F5;color:#1E3E70}.tp-compra{background:#E0F0E8;color:#1F6146}.tp-assoc{background:#FBEBD5;color:#8A5410}
/* logo das lojas: fundo branco; a logo clara ganha o azul (fundoDaLogo) */
.lg{width:58px;height:36px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;font:700 12px/1 var(--f2);color:var(--mut)}
.lg img{max-width:46px;max-height:24px;object-fit:contain}
.lg.g{width:84px;height:54px;border-radius:14px}.lg.g img{max-width:66px;max-height:36px}
/* relatório de leads */
.rel{background:#fff;border-radius:26px;padding:26px 30px;display:flex;flex-wrap:wrap;align-items:center;gap:22px 44px;box-shadow:var(--sombra)}
#relDash{margin-top:44px}
#relLeads{margin-bottom:28px}
.rel-e{flex:1 1 260px}
.rel .kk{color:var(--goldtx)}
.pps{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.pp{height:36px;padding:0 15px;border-radius:99px;background:#F1EEEA;font:500 13.5px/1 var(--f2);transition:background .2s}
.pp:hover{background:#E8E3DC}
.pp.on{background:var(--navy);color:#fff}
.rel-d{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--mut)}
.rel-d input{height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:13px}
.rel-n{display:flex;flex-wrap:wrap;gap:20px 40px}
.rel-n b{display:block;font:500 34px/1 var(--f1);font-variant-numeric:tabular-nums}
.rel-n span{display:block;margin-top:6px;font-size:13px;color:var(--mut)}
/* filtros em pílulas: todas do mesmo tamanho, o da maior (pedido do Luiz, 20/10/2026); trocando, a pílula muda em fusão e a lista entra
   em fusão, como os filtros do site */
.chips{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;width:max-content;max-width:100%}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:99px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);font:500 13.5px/1 var(--f2);white-space:nowrap;transition:box-shadow .25s,background .25s,color .25s}
.chip:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.chip.on{background:var(--navy);color:#fff;box-shadow:none}
.chip.erro:not(.on){color:#9A2F22}
.chip i{font-style:normal;font-size:12px;opacity:.7}
.filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.fbusca{flex:0 1 320px;min-width:230px;display:flex;align-items:center;gap:10px;height:42px;padding:0 16px;border-radius:99px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);color:var(--mut)}
.fbusca input{flex:1;min-width:0;border:0;background:none;font-size:14px}
.limpar{display:none;font-size:13.5px;font-weight:600;color:var(--mut)}
.limpar.on{display:inline-block}.limpar:hover{color:var(--ink)}
.vcount{margin-bottom:18px;font-size:13.5px;color:var(--mut)}
.vcount b{color:var(--ink)}.vcount .alerta{color:#9A2F22;font-weight:600}
/* lista suspensa própria, com as animações dos filtros do site: abre e fecha em fusão, e o botão vai do tamanho antigo ao novo com o texto
   novo surgindo. A barra de rolagem fica dentro dos cantos redondos (antes, a do sistema deixava a lista quadrada) */
.dd{position:relative;display:inline-block}
.dd select{display:none}
.dd-t{display:inline-flex;align-items:center;justify-content:space-between;gap:10px;width:190px;height:42px;padding:0 14px 0 16px;border-radius:99px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);font:500 13.5px/1 var(--f2);color:var(--ink);white-space:nowrap;transition:box-shadow .2s,background .2s,color .2s}
.dd-t>span{min-width:0;overflow:hidden;text-overflow:ellipsis}   /* os filtros têm todos a mesma largura: o nome comprido termina em reticências */
.dd-t svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;flex:none;transition:transform .25s var(--ease)}
.dd.on .dd-t{box-shadow:inset 0 0 0 1px var(--ink)}
.dd.on .dd-t svg{transform:rotate(180deg)}
.dd.marcado .dd-t{background:var(--navy);color:#fff;box-shadow:none}
.dd-t.anda>span{animation:fpTexto .32s var(--ease) both}
@keyframes fpTexto{from{opacity:0;transform:translateY(5px)}}
.dd-p{display:none;padding:6px;border-radius:16px;background:#fff;box-shadow:0 22px 50px -18px rgba(0,9,26,.42),0 0 0 1px rgba(11,26,51,.06);overflow:auto;overscroll-behavior:contain}
.dd-p.on{display:block;animation:dropEntra .2s var(--ease) both}   /* a lista fica no corpo da página (por cima de tudo); a origem vem do lado em que abre */
.dd-p.sai{display:block;animation:dropSai .14s ease-in both;pointer-events:none}
@keyframes dropEntra{from{opacity:0;transform:translateY(-6px) scale(.98)}}
@keyframes dropSai{to{opacity:0;transform:translateY(-4px) scale(.98)}}
.dd-p::-webkit-scrollbar,.pop::-webkit-scrollbar,.avisos::-webkit-scrollbar{width:12px}
.dd-p::-webkit-scrollbar-track,.pop::-webkit-scrollbar-track,.avisos::-webkit-scrollbar-track{background:transparent;margin:10px 0}
.dd-p::-webkit-scrollbar-thumb,.pop::-webkit-scrollbar-thumb,.avisos::-webkit-scrollbar-thumb{background:rgba(11,26,51,.18) padding-box;border:4px solid transparent;border-radius:99px}
.dd-p::-webkit-scrollbar-thumb:hover{background-color:rgba(200,134,46,.6)}
@supports not selector(::-webkit-scrollbar){.dd-p,.pop,.avisos{scrollbar-width:thin;scrollbar-color:rgba(11,26,51,.2) transparent}}
.dd-o{padding:9px 12px;border-radius:10px;font-size:13.5px;white-space:nowrap;cursor:pointer;transition:background .15s}
.dd-o:hover{background:#F4F1EC}.dd-o.sel{font-weight:700}
.dd.cor .dd-t{min-width:0;height:34px;padding:0 10px 0 12px;font-size:12.5px}

/* ===== listas com a camada que abre (Associados e Leads): uma linha por item; tocada, a página se abre embaixo dela e mostra uma camada
   azul de ponta a ponta, como em Associados no celular (pedido do Luiz, 20/10/2026) ===== */
/* sem linhas entre as empresas (pedido do Luiz, 20/10/2026): o fundo do mouse passa um pouco das bordas, e o conteúdo fica alinhado com elas */
.lr{display:flex;align-items:center;gap:16px;width:calc(100% + 28px);min-height:70px;margin:0 -14px;padding:12px 14px;border-radius:14px;text-align:left;cursor:pointer;transition:background .2s}
.lr:hover{background:rgba(255,255,255,.75)}
.lr.on{background:#fff;border-radius:14px 14px 0 0}
.lr .i{width:22px;flex:none;font-size:12px;color:#A9A198;font-variant-numeric:tabular-nums}
.lr .nm{flex:1;min-width:0}
.lr .nm b{display:block;font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .2s}
.lr .nm small{display:block;margin-top:2px;font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr.on .nm b{color:var(--goldtx)}
.lr .q{flex:none;min-width:110px;text-align:right;font-size:13px;color:var(--mut);white-space:nowrap}
.lr .q b{font:500 19px/1 var(--f1);color:var(--ink)}
.lr .st{flex:none;min-width:150px;display:flex;justify-content:flex-end;font-size:13px;color:var(--mut);white-space:nowrap}
.lr .chev{flex:none;width:18px;height:18px;color:#A9A198;transition:transform .35s var(--ease),color .2s}
.lr.on .chev{transform:rotate(90deg);color:var(--goldtx)}
.cam{position:relative;margin:0 calc(50% - 50vw);padding:36px calc(50vw - 50%) 34px;background:var(--navy);color:#fff;box-shadow:inset 0 16px 16px -16px rgba(0,0,0,.65),inset 0 -16px 16px -16px rgba(0,0,0,.65)}
.cam .kk{color:var(--gold3)}
.cm-cab{display:flex;align-items:center;gap:22px}
.cm-cab .lg.g,.cm-cab .av{flex:none}
.cm-cab .av{width:54px;height:54px;background:rgba(255,255,255,.08);color:var(--gold3);font-size:16px}
.cm-v{flex:1;min-width:0}
.cm-v h3{margin-top:6px;font:600 30px/1.08 var(--f1);letter-spacing:-.03em}
.cm-v p{margin-top:6px;color:#93A3B9;font-size:14px}
.cm-v p a{color:#B9C6DA;text-decoration:underline;text-underline-offset:3px}
.cm-v p a:hover{color:var(--gold3)}
.cm-n{flex:none;display:flex;gap:44px}
.cm-n b{display:block;font:600 30px/1 var(--f1);letter-spacing:-.03em}
.cm-n b i{margin-left:.1em;font-style:normal;font-size:.62em;color:var(--gold3)}
.cm-n span{display:block;margin-top:8px;font:600 10.5px/1.3 var(--f2);letter-spacing:.18em;text-transform:uppercase;color:var(--gold3)}
.cm-i{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px 34px;margin-top:26px;padding-top:24px;border-top:1px solid rgba(255,255,255,.12)}
.cm-i span{display:block;font:600 10.5px/1.2 var(--f2);letter-spacing:.18em;text-transform:uppercase;color:var(--gold3)}
.cm-i p{margin-top:7px;color:#fff;font-size:14.5px;line-height:1.45;overflow-wrap:anywhere}
.cm-i p.mut{color:#8592AA}
.cm-i p.erro{color:#F5A193}
.cm-i a{color:#fff}
.cm-i a:hover{color:var(--gold3)}
.cm-b{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:26px}
.cm-b .x-p{margin-left:auto}
.cm-tx{margin-top:10px;max-width:640px;color:#B9C6DA;font-size:14.5px;line-height:1.55}
/* botões sobre o azul: o contorno do site e o excluir só em texto */
.bto{display:inline-flex;align-items:center;gap:9px;height:46px;padding:0 22px;border-radius:99px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28);color:#fff;font:600 14.5px/1 var(--f2);white-space:nowrap;transition:box-shadow .2s,color .2s}
.bto:hover{box-shadow:inset 0 0 0 1px var(--gold3);color:var(--gold3)}
.bto.sm{height:38px;padding:0 16px;font-size:13.5px}
.x-p{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 6px;color:#F5A193;font:600 14px/1 var(--f2);transition:color .2s}
.x-p:hover{color:#FFC6BD}
/* campos sobre o azul, no padrão dos formulários do site */
.cp{display:block;min-width:0}
.cp>span{display:block;margin-bottom:8px;font:600 10.5px/1.2 var(--f2);letter-spacing:.18em;text-transform:uppercase;color:var(--gold3)}
.cp>span small{font-weight:500;letter-spacing:.04em;text-transform:none;color:#8592AA}
.cp input,.cp textarea{width:100%;height:48px;padding:0 16px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#fff;font-size:14.5px;color-scheme:dark;transition:border-color .2s,background .2s}
.cp textarea{height:auto;padding:13px 16px;line-height:1.6;resize:vertical}
.cp input::placeholder,.cp textarea::placeholder{color:#61718C}
.cp input:focus,.cp textarea:focus{border-color:rgba(244,176,92,.65);background:rgba(255,255,255,.09)}
.cp input.bad{border-color:#E0685A}
.cps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px 20px;margin-top:22px}
.cps .lg2{grid-column:1/-1}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{height:44px;padding:0 18px;border-radius:99px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);color:#CFD9E8;font:500 13.5px/1 var(--f2);transition:background .25s,box-shadow .25s,color .25s}
.seg button:hover{box-shadow:inset 0 0 0 1px rgba(255,255,255,.4);color:#fff}
.seg button.on{background:rgba(244,176,92,.16);box-shadow:inset 0 0 0 1px rgba(244,176,92,.55);color:var(--gold3)}
.sw-l{display:flex;align-items:center;gap:12px;height:48px;color:#CFD9E8;font-size:14px;cursor:pointer}
/* o andamento do robô dentro da camada */
.and{margin-top:24px;max-width:640px}
.and .bar{height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.and .bar i{display:block;width:0;height:100%;border-radius:99px;background:linear-gradient(90deg,#C8862E,#F0AD57);transition:width .6s var(--ease)}
.and p{margin-top:12px;display:flex;align-items:center;gap:10px;color:#CFD9E8;font-size:14px}
.and p svg{animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.ok-n{margin-top:22px;display:flex;align-items:center;gap:12px;font-size:15px}
.ok-n i{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(119,201,160,.16);color:#8FD6B0}
.falta{margin-top:22px;padding:16px 18px;border-radius:16px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);color:#CFD9E8;font-size:14px;line-height:1.5}
.falta b{color:#fff}
/* logo escolhida no formulário */
.lgc{display:flex;align-items:center;gap:12px}
.lgc .lg{width:84px;height:48px}
.cam .lg:empty,.tform .lg:empty{background:rgba(255,255,255,.04);box-shadow:none;border:1px dashed rgba(255,255,255,.24)}
.cps .dois{grid-column:span 2}
.lgc label{cursor:pointer}
.xc{width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#B9C6DA;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);transition:color .2s,box-shadow .2s}
.xc:hover{color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
/* associados */
.lr .lg{width:64px;height:40px}
.lr .lg img{max-width:50px;max-height:26px}
.cred{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--goldtx)}
/* veículos */
.vbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.vbar .vcount{margin:0}
.modo{display:flex;gap:4px;padding:4px;border-radius:99px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.modo button{width:36px;height:34px;border-radius:99px;display:flex;align-items:center;justify-content:center;color:var(--mut);transition:background .2s,color .2s}
.modo button:hover{color:var(--ink)}
.modo button.on{background:var(--navy);color:#fff}
#veicLista.troca{animation:entra .4s var(--ease) backwards}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.vgrid>.cam{grid-column:1/-1}   /* na grade, as informações abrem embaixo da fileira do carro, de ponta a ponta */
.vc{display:flex;flex-direction:column;border-radius:20px;overflow:hidden;background:#fff;box-shadow:var(--sombra);cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s}
.vc:hover,.vc.on{transform:translateY(-2px);box-shadow:0 1px 0 rgba(11,26,51,.04),0 22px 40px -24px rgba(11,26,51,.38)}
.vc.on{box-shadow:0 0 0 2px var(--gold2),0 22px 40px -24px rgba(11,26,51,.38)}
.vc .ft{position:relative;aspect-ratio:4/3;background:#E9E4DD center/cover no-repeat}
.vc .ft .pl{position:absolute;top:10px;left:10px}
/* o cartão sem nada cortado (pedido do Luiz, 21/10/2026): o nome em até duas linhas, o ano e o km, a loja numa linha só dela, e o preço
   com a chave do site embaixo (antes a chave dividia a linha com a loja e o ano, que saíam cortados) */
.vc .b{flex:1;display:flex;flex-direction:column;gap:3px;padding:14px 16px}
.vc h4{font:500 16px/1.25 var(--f1);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vc .vm{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vc .vp{margin-top:auto;padding-top:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.vc .pr{font:600 16px/1.2 var(--f1);white-space:nowrap}
/* a segunda visualização: em lista (pedido do Luiz, 20/10/2026) */
.vl{border-top:1px solid var(--line)}
.vli{display:grid;grid-template-columns:96px minmax(0,2.2fr) 70px 100px 112px minmax(0,1.2fr) 92px 42px;gap:16px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.vli .nm b{transition:color .2s}
.vli:hover .nm b,.vli.on .nm b{color:var(--goldtx)}
.vli.on{border-bottom-color:transparent}
.vli .ft{width:96px;aspect-ratio:4/3;border-radius:10px;background:#E9E4DD center/cover no-repeat}
.vli .nm{min-width:0}
.vli .nm b{display:block;font:500 15.5px/1.25 var(--f1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vli .nm small{display:block;margin-top:2px;font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vli .c{font-size:13.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vli .pr{font:600 15px/1.2 var(--f1);white-space:nowrap}
.vli .st{display:flex;justify-content:flex-end}
.vli-h{padding-top:0;padding-bottom:12px;border-bottom:1px solid var(--ink);cursor:default;font:600 11px/1 var(--f2);letter-spacing:.16em;text-transform:uppercase;color:#5E6B80}
.switch{position:relative;width:42px;height:24px;border-radius:99px;background:#D7D1C9;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s var(--ease)}
.switch.on{background:var(--gold2)}
.switch.on::after{transform:translateX(18px)}
.cam .switch{background:rgba(255,255,255,.18)}.cam .switch.on{background:var(--gold2)}
.pager{display:none}
/* leads */
.ll-h,.ll{display:grid;grid-template-columns:10px 96px 118px minmax(0,1.1fr) minmax(0,1.3fr) minmax(0,.9fr) 18px;gap:14px;align-items:center}
.ll-h{padding:0 0 12px;border-bottom:1px solid var(--ink);font:600 11px/1 var(--f2);letter-spacing:.16em;text-transform:uppercase;color:#5E6B80}
.ll{padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ll:hover .ll-c b,.ll.on .ll-c b{color:var(--goldtx)}
.ll.on{border-bottom-color:transparent}
.ll .nv{width:8px;height:8px;border-radius:50%;background:var(--gold2);box-shadow:0 0 0 3px rgba(232,160,72,.2)}
.ll-d{font-size:13px;color:var(--mut);white-space:nowrap}
.ll-c{min-width:0}
.ll-c b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .2s}
.ll.novo .ll-c b{font-weight:700}
.ll-c small,.ll-l{font-size:13px;color:var(--mut)}
.ll-i,.ll-l{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ll .chev{width:18px;height:18px;color:#A9A198;transition:transform .35s var(--ease),color .2s}
.ll.on .chev{transform:rotate(90deg);color:var(--goldtx)}
/* mural */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:20px}
.pc{display:flex;flex-direction:column;border-radius:22px;overflow:hidden;background:#fff;box-shadow:var(--sombra)}
.pc-f{aspect-ratio:16/10;background:#E9E4DD;display:flex;align-items:center;justify-content:center;color:#A9A198}
.pc-f img{width:100%;height:100%;object-fit:cover}
.pc-b{flex:1;padding:16px 18px 4px}
.pc-k{font-size:12.5px;color:var(--mut)}
.pc-k b{font-weight:600;color:var(--goldtx)}
.pc h3{margin-top:6px;font:500 19px/1.25 var(--f1)}
.pc p{margin-top:6px;font-size:13.5px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc-tags{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
/* "Ver no site" à esquerda e, à direita, só a bolinha de editar; com o mouse em cima, o excluir sai de baixo dela (pedido do Luiz, 20/10/2026) */
.pc-a{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 16px 18px}
.pc-ed{position:relative;display:flex}
.pc-e,.pc-x{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.pc-e{position:relative;z-index:2;background:var(--navy);color:#fff;transition:background .2s}
.pc-e:hover{background:#10264A}
.pc-x{position:absolute;top:0;right:0;z-index:1;background:#F8E1DE;color:#9A2F22;opacity:0;transform:scale(.6);pointer-events:none;transition:transform .35s var(--ease),opacity .2s,background .2s}
.pc-x:hover{background:#F2CDC8}
.pc-ed:hover .pc-x,.pc-ed:focus-within .pc-x{opacity:1;transform:translateX(-48px);pointer-events:auto}
@media (hover:none){.pc-x{display:none}}   /* sem mouse, o excluir fica no editor */
/* o editor do mural, no azul do topo e no padrão do site: campos escuros e o botão dourado. À direita, as fotos pequenas (mais de uma;
   a primeira é a capa) e a prévia de como a publicação aparece na lista do site, que termina na linha do fim do texto (pedido do Luiz,
   21/10/2026) */
.ed-g{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px 44px;align-items:stretch}
.ed-c{display:flex;flex-direction:column;gap:20px;min-width:0}
.ed-lado{display:flex;flex-direction:column;gap:22px;min-width:0}
/* o texto e o resumo crescem até o fim da fileira: as duas colunas terminam sempre na mesma linha */
.ed-txt{flex:1 1 auto;display:flex;flex-direction:column}
.ed-txt textarea{flex:1 1 auto;min-height:230px}
.ed-tit{height:62px!important;font:500 24px/1 var(--f1)!important;letter-spacing:-.01em}
.ed-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.ed-fotos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ed-f{position:relative;aspect-ratio:4/3;border-radius:12px;background:#0A1A33 center/cover no-repeat;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);cursor:pointer;transition:box-shadow .2s}
.ed-f:hover{box-shadow:inset 0 0 0 1px rgba(244,176,92,.6)}
.ed-f.capa{box-shadow:0 0 0 2px var(--gold2)}
.ed-f em{position:absolute;left:6px;bottom:6px;padding:4px 7px;border-radius:99px;background:rgba(0,9,26,.78);color:var(--gold3);font:600 9.5px/1 var(--f2);font-style:normal;letter-spacing:.1em;text-transform:uppercase}
.ed-f .x{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(0,9,26,.78);color:#fff;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s,background .2s}
.ed-f .x:hover{background:#9A2F22}
.ed-f:hover .x,.ed-f:focus-within .x{opacity:1}
@media (hover:none){.ed-f .x{opacity:1}}
.ed-mais{aspect-ratio:4/3;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:1px dashed rgba(255,255,255,.26);color:#8592AA;font-size:12px;cursor:pointer;transition:border-color .2s,color .2s}
.ed-mais:hover{border-color:rgba(244,176,92,.6);color:var(--gold3)}
.ed-dica{margin-top:8px;font-size:12px;color:#8592AA}
/* o resumo ocupa o que sobra na coluna: as duas colunas terminam na mesma linha, sem buraco entre as fotos e a prévia */
.ed-res{flex:1 1 auto;display:flex;flex-direction:column}
.ed-res textarea{flex:1 1 auto;min-height:96px;resize:none}
.ed-prev{margin-top:auto}
.ed-prev>span{display:block;margin-bottom:10px;font:600 10.5px/1.2 var(--f2);letter-spacing:.18em;text-transform:uppercase;color:var(--gold3)}
.pv{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--cl);color:var(--ink)}
.pv-f{width:104px;aspect-ratio:4/3;border-radius:10px;flex:none;background:#E9E4DD center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#A9A198}
.pv small{display:block;font:600 11px/1.2 var(--f2);letter-spacing:.06em;text-transform:uppercase;color:var(--goldtx)}
.pv b{display:block;margin-top:6px;font:500 16px/1.3 var(--f1);overflow-wrap:anywhere}
.pv span{display:block;margin-top:6px;font-size:12.5px;color:var(--mut)}
.tform .cm-b.ed-b{margin-top:26px}

/* ===== menu: a barra em pílula do site, fixa embaixo. Como no site, a parte aberta mostra o nome, e o mouse em cima de outra abre o
   nome dela também (pedido do Luiz, 20/10/2026) ===== */
.menu{position:fixed;left:50%;bottom:22px;z-index:90;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:6px;border-radius:99px;background:#fff;box-shadow:0 12px 30px -12px rgba(0,9,26,.45),0 0 0 1px rgba(11,26,51,.06);view-transition-name:menu}
.menu a,.menu button{position:relative;display:flex;align-items:center;justify-content:center;min-width:40px;height:40px;padding:0 10px;border-radius:99px;color:var(--mut);font:600 14px/1 var(--f2);white-space:nowrap;transition:background .2s,color .2s}
.menu .nl{display:block;overflow:hidden;width:0;opacity:0;transition:width .26s var(--ease),margin .26s var(--ease),opacity .2s}
.menu .nl.vis{margin-left:8px;opacity:1;transition:width .26s var(--ease),margin .26s var(--ease),opacity .2s .12s}
.menu .nl>span{display:block;white-space:nowrap;line-height:1.9}
.menu a.on{background:#EEF0F3;color:var(--ink)}
.menu a:not(.on):hover,.menu button:hover,.menu .hov{color:var(--ink);background:#F4F5F7}
.menu .sep{width:1px;height:22px;margin:0 4px;background:var(--line)}
.menu .bdg{position:absolute;top:2px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--gold2);color:var(--navy);font:700 11px/18px var(--f2);text-align:center}
.menu .nome .bdg{position:static;margin-left:6px}
/* as páginas do estoque: uma seta de cada lado do menu, como no site; com o mouse em cima, aparece o texto */
.menu .pgs{position:absolute;top:50%;height:52px;min-width:0;padding:0 15px;background:#fff;box-shadow:0 12px 30px -12px rgba(0,9,26,.45),0 0 0 1px rgba(11,26,51,.06);color:var(--ink);opacity:0;visibility:hidden;transform:translateY(-50%) scale(.85);transition:opacity .25s,visibility .25s,transform .35s var(--ease),background .2s}
.menu .pgs:hover{background:#F4F5F7}
.menu .pg-ant{right:calc(100% + 12px)}
.menu .pg-prox{left:calc(100% + 12px)}
.menu.ant-on .pg-ant,.menu.prox-on .pg-prox{opacity:1;visibility:visible;transform:translateY(-50%)}   /* nomes próprios: "pp" era o das pílulas do relatório e encolhia o menu */
.menu .pgs .pt{display:block;overflow:hidden;max-width:0;opacity:0;transition:max-width .3s var(--ease),margin .3s var(--ease),opacity .2s}
.menu .pgs:hover .pt{max-width:170px;opacity:1}
.menu .pg-ant:hover .pt{margin-left:8px}
.menu .pg-prox:hover .pt{margin-right:8px}

/* ===== transição de página: tudo troca em fusão, também o topo (antes, só a folha clara). O menu fica de fora, parado na tela ===== */
::view-transition-old(root),::view-transition-new(root){animation-duration:.42s;animation-timing-function:ease}
::view-transition-group(menu),::view-transition-image-pair(menu),::view-transition-new(menu){animation:none}
::view-transition-old(menu){display:none}
.htit .data{view-transition-name:data-topo}
.htit h1.pg{view-transition-name:titulo-pg}
.vt-simples .htit .data,.vt-simples .htit h1.pg{view-transition-name:none}
::view-transition-group(data-topo){animation-duration:.55s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
::view-transition-old(data-topo),::view-transition-new(data-topo){animation-duration:.55s;height:100%;object-fit:fill}
::view-transition-new(titulo-pg){animation:vtSurge .5s .12s cubic-bezier(.2,.8,.2,1) both}
::view-transition-old(titulo-pg){animation:vtSai .22s ease-in both}
@keyframes vtSurge{from{opacity:0;transform:translateY(16px)}}
@keyframes vtSai{to{opacity:0;transform:translateY(-8px)}}

/* ===== o anúncio, que abre embaixo do carro como as outras partes (pedido do Luiz, 20/10/2026; antes era uma janela) ===== */
.cv{display:grid;grid-template-columns:minmax(0,620px) minmax(0,1fr);gap:28px 44px;align-items:start}
.cv-foto{position:relative;aspect-ratio:4/3;border-radius:18px;background:#0A1A33 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#8592AA;font-size:13.5px}
.cv-d h3{margin-top:8px;font:600 30px/1.08 var(--f1);letter-spacing:-.03em}
.cv-ver{margin-top:6px;color:#93A3B9;font-size:14px}
.cv-preco{margin-top:16px;font:600 34px/1 var(--f1);letter-spacing:-.02em;color:var(--gold3)}
/* os dados sem a linha em cima (pedido do Luiz, 21/10/2026), os links com a chave do site à direita e os opcionais logo embaixo deles */
.cv .cm-i{margin-top:22px;padding-top:0;border-top:0}
.cv-acoes{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:24px}
.cv-acoes .sw-l{margin-left:auto;height:46px}
.cv-o{margin-top:26px}
.cv-o>span{display:block;font:600 10.5px/1.2 var(--f2);letter-spacing:.18em;text-transform:uppercase;color:var(--gold3)}
/* as outras fotos numa fileira da largura da foto grande, cinco por vez; as setas ficam do lado de fora, uma de cada lado */
.tirasbox{position:relative;margin-top:10px}
.tiras{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.tiras div{aspect-ratio:4/3;border-radius:9px;background:#0A1A33 center/cover;cursor:pointer;opacity:.55;transition:opacity .2s,box-shadow .2s}
.tiras div.sel,.tiras div:hover{opacity:1}
.tiras div.sel{box-shadow:0 0 0 2px var(--gold2)}
.seta{position:absolute;top:50%;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;transform:translateY(-50%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);color:#fff;transition:box-shadow .2s,color .2s,opacity .2s}
.seta:hover:not(:disabled){box-shadow:inset 0 0 0 1px var(--gold3);color:var(--gold3)}
.seta:disabled{opacity:.3;cursor:default}
.seta.ant{right:calc(100% + 8px)}
.seta.prox{left:calc(100% + 8px)}
.chipsx{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.chipsx span{padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.08);color:#CFD9E8;font-size:12.5px}
/* aviso que aparece embaixo */
.toast{position:fixed;left:50%;bottom:92px;z-index:300;transform:translate(-50%,16px);display:flex;align-items:center;gap:10px;max-width:calc(100vw - 32px);padding:12px 20px 12px 14px;border-radius:99px;background:var(--navy);color:#fff;font-size:14px;font-weight:500;box-shadow:0 18px 40px -16px rgba(0,9,26,.6);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast .ok{width:24px;height:24px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--gold2);color:var(--navy)}

@media (max-width:1100px){
  :root{--lado:28px}
  .busca{width:230px}
  .htit h1{font-size:48px}
  .hkpi .n{font-size:50px}
  .lr .st{min-width:120px}
  .vli{grid-template-columns:84px minmax(0,2fr) 60px 92px 104px 90px 42px}
  .vli .lj,.vli-h .lj{display:none}
  .ed-g,.cv{grid-template-columns:1fr}
  .gf-grade{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gc-dia{grid-column:1/-1}
  .gc-tempo,.gc-carros,.gc-origem,.gc-hora,.gc-busca,.gc-lojas{grid-column:span 1}
  .na-g{grid-template-columns:repeat(2,minmax(0,1fr))}
  .na-g .cm-b{grid-column:1/-1}
  /* numa coluna só, a foto vai de uma borda à outra: as setas ficam por cima das pontas da fileira */
  .seta{background:rgba(0,9,26,.82)}
  .seta.ant{right:auto;left:6px}
  .seta.prox{left:auto;right:6px}
}
@media (max-width:760px){
  :root{--lado:5.63vw;--canto:28px}   /* as laterais do site no celular */
  body{font-size:14px}
  .topo{padding:18px var(--lado) calc(var(--canto) + 30px)}
  .topo-in{grid-template-columns:auto 1fr;grid-template-areas:"logo acoes" "tit tit" "form form" "busca busca" "kpi kpi" "graf graf";column-gap:12px}
  .hgraf{margin-top:36px}
  .gf-cab{flex-wrap:wrap}
  .gf-grade{grid-template-columns:minmax(0,1fr);gap:12px}
  .gc-dia,.gc-tempo,.gc-carros,.gc-origem,.gc-hora,.gc-busca,.gc-lojas{grid-column:auto}
  .gc{padding:18px 18px 20px;border-radius:18px}
  .gnum b{font-size:34px}
  .gtopo>div:first-child,.gmini{width:100%}
  .gmini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 14px}
  .gplot,.gc-dia .gplot,.gc-hora .gplot{height:170px;min-height:170px;flex:none}
  .tform{margin-top:28px}
  .na-g{grid-template-columns:minmax(0,1fr)}
  .na-g .cm-b .bt,.na-g .cm-b .bto{flex:1 1 0;justify-content:center}
  .ed-fotos{grid-template-columns:repeat(3,minmax(0,1fr))}
  .vc .vm{font-size:11.5px}
  .cv-acoes .bto{flex:1 1 calc(50% - 5px);justify-content:center;padding:0 12px}
  .cv-acoes .sw-l{margin-left:0;flex-basis:100%}
  .tlogo{height:22px;justify-self:start}
  .tacoes{gap:8px;padding-right:52px}
  .uchip{display:none}
  .cir{width:40px;height:40px}
  /* no celular, o botão do menu fica sempre à mão, no canto, como no site */

  .chip{padding:0 12px}

  .lr .q{min-width:0}
  .lr .st{display:none}

  .cv-preco{font-size:28px}
  .cm-n{flex-basis:100%;gap:36px}
  .cm-n b{font-size:24px}

  .pager{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:22px}
  .pager button{height:42px;padding:0 18px;border-radius:99px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);font:600 13.5px/1 var(--f2)}
  .pager button:disabled{opacity:.4}

  .fbusca{flex:1 1 100%}
  .filtros .dd{flex:1 1 calc(50% - 5px)}

  .vbar{flex-wrap:wrap}
  .ll-h{display:none}
  .ll{grid-template-columns:10px minmax(0,1fr) auto;grid-template-areas:"n c t" "n i i" "n l d";row-gap:5px;padding:12px 0}
  .ll>.nv,.ll>.nv0{grid-area:n;align-self:start;margin-top:7px}

  .ll .chev{display:none}
  .pgrid{grid-template-columns:1fr}
}

  return lista.map(c=>{const v=veicAll.find(x=>x.id===c.id),nome=v?nomeV(v):(titulo([c.marca,c.modelo].filter(Boolean).join(' '))||'Anúncio'),foto=v?fotoV(v):(c.foto||''),ano=v?v.ano_modelo:c.ano;
    return `<button type="button" class="gcar" onclick="verVeiculo(${c.id})"><span class="ft"${foto?` style="background-image:url('${esc(foto)}')"`:''}></span><span class="nm"><b>${esc(nome)}${ano?' '+esc(ano):''}</b><small>${esc((v&&v.loja_nome)||c.loja||'')}${!v?' · saiu do ar':''}</small><i><u data-w="${(c.vistas/max*100).toFixed(1)}"></u></i></span><b>${fmt(c.vistas)}<small>${c.vistas===1?'visita':'visitas'}</small></b></button>`;}).join('');
}

}

  desenharDia(anim);desenharHoras(anim);

  if(anim){requestAnimationFrame(()=>requestAnimationFrame(crescer));g.querySelectorAll('.gnum b[data-n]').forEach(e=>contar(e,+e.dataset.n,1400));}

// a dica com o valor, presa à tela, perto do ponto (sem argumentos, some)
function dica(x,y,v,r){
  const t=$('gTip');if(!t)return;if(x==null){t.hidden=true;return;}
  t.innerHTML=`<b>${esc(v)}</b><span>${esc(r)}</span>`;t.hidden=false;
  const w=t.offsetWidth,h=t.offsetHeight;let tp=y-h-14;if(tp<8)tp=y+18;
  t.style.left=Math.max(8,Math.min(innerWidth-w-8,x-w/2))+'px';t.style.top=tp+'px';
}
// visitas por dia: a linha dourada com a área clara embaixo; o mouse, o dedo ou as setas do teclado acham o dia mais perto
function desenharDia(animar){
  const box=$('gDia');if(!box||!VIS)return;
  const d=VIS.porDia||[],n=d.length,W=box.clientWidth,H=box.clientHeight,EL=40,EB=24,pw=W-EL,ph=H-EB;if(!W||!n)return;
  const passo=passoBom(Math.max(0,...d.map(p=>p.visitas))/4),max=passo*4;
  const x=i=>EL+(n<2?pw/2:i*pw/(n-1)),y=v=>ph-(v/max)*ph,pts=d.map((p,i)=>[x(i),y(p.visitas)]);
  const linha=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const grade=[0,1,2,3,4].map(k=>{const yy=(ph-k*ph/4).toFixed(1);return `<line class="grade" x1="${EL}" x2="${W}" y1="${yy}" y2="${yy}"/><text class="eixo" x="${EL-10}" y="${(+yy+4).toFixed(1)}" text-anchor="end">${fmtCurto(passo*k)}</text>`;}).join('');
  const cada=n<=7&&pw/n>=40?1:Math.ceil(n/Math.max(2,Math.min(6,Math.floor(pw/72))));   // as datas que cabem sem encostar uma na outra
  const rot=d.map((p,i)=>((i%cada===0&&n-1-i>=cada*.6)||i===n-1)?`<text class="eixo" x="${x(i).toFixed(1)}" y="${H-4}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${diaCurto(p.dia,n<=7)}</text>`:'').join('');
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" aria-hidden="true"><defs><linearGradient id="gArea" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#F4B05C" stop-opacity=".24"/><stop offset="1" stop-color="#F4B05C" stop-opacity="0"/></linearGradient></defs>
    ${grade}${rot}<g class="rev${animar?'':' on'}"><path class="area" d="${linha} L${x(n-1).toFixed(1)} ${ph} L${x(0).toFixed(1)} ${ph} Z"/><path class="linha" d="${linha}"/></g>
    <line class="mira" y1="0" y2="${ph}" visibility="hidden"/><circle class="ponto" r="4.5" visibility="hidden"/></svg>`;
  if(animar)requestAnimationFrame(()=>requestAnimationFrame(()=>{const r=box.querySelector('.rev');if(r)r.classList.add('on');}));
  const mira=box.querySelector('.mira'),ponto=box.querySelector('.ponto');
  const mostra=i=>{i=Math.max(0,Math.min(n-1,i));box._i=i;const p=d[i],[px,py]=pts[i],r=box.getBoundingClientRect();
    mira.setAttribute('x1',px);mira.setAttribute('x2',px);mira.setAttribute('visibility','visible');
    ponto.setAttribute('cx',px);ponto.setAttribute('cy',py);ponto.setAttribute('visibility','visible');
    dica(r.left+px,r.top+py,`${fmt(p.visitas)} ${p.visitas===1?'visita':'visitas'}`,`${diaLongo(p.dia)} · ${fmt(p.paginas)} ${p.paginas===1?'página':'páginas'}`);};
  const some=()=>{mira.setAttribute('visibility','hidden');ponto.setAttribute('visibility','hidden');dica();};
  box.onpointermove=e=>{const r=box.getBoundingClientRect();mostra(Math.round((e.clientX-r.left-EL)/(pw/Math.max(1,n-1))));};
  box.onpointerleave=some;box.onblur=some;box.onfocus=()=>mostra(box._i==null?n-1:box._i);
  box.onkeydown=e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();mostra((box._i==null?n-1:box._i)+(e.key==='ArrowRight'?1:-1));}};
}
// horário: uma coluna por hora (finas, redondas em cima, retas na base); o mouse acende a hora e mostra o valor
function desenharHoras(animar){
  const box=$('gHora');if(!box||!VIS)return;
  const h=VIS.horas||[],W=box.clientWidth,H=box.clientHeight,EB=22,ph=H-EB;if(!W)return;
  const max=Math.max(1,...h),slot=W/24,bw=Math.min(24,slot*.62);
  const col=(x,y,w,a)=>{const r=Math.min(4,w/2,a);return `M${x.toFixed(1)} ${(y+a).toFixed(1)}V${(y+r).toFixed(1)}Q${x.toFixed(1)} ${y.toFixed(1)} ${(x+r).toFixed(1)} ${y.toFixed(1)}H${(x+w-r).toFixed(1)}Q${(x+w).toFixed(1)} ${y.toFixed(1)} ${(x+w).toFixed(1)} ${(y+r).toFixed(1)}V${(y+a).toFixed(1)}Z`;};
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" aria-hidden="true"><defs><linearGradient id="gCol" x1="0" x2="0" y1="1" y2="0"><stop offset="0" stop-color="#C8862E"/><stop offset="1" stop-color="#F0AD57"/></linearGradient></defs>
    <line class="grade" x1="0" x2="${W}" y1="${ph}" y2="${ph}"/>
    ${h.map((v,i)=>{const a=v?Math.max(3,v/max*ph):0;return a?`<path class="col" data-i="${i}" d="${col(i*slot+(slot-bw)/2,ph-a,bw,a)}"/>`:'';}).join('')}
    ${[0,6,12,18,23].map(i=>`<text class="eixo" x="${(i*slot+slot/2).toFixed(1)}" y="${H-4}" text-anchor="middle">${i}h</text>`).join('')}</svg>`;
  if(animar)requestAnimationFrame(()=>requestAnimationFrame(()=>box.classList.add('on')));else box.classList.add('on');
  const mostra=i=>{i=Math.max(0,Math.min(23,i));box._i=i;const r=box.getBoundingClientRect();
    box.querySelectorAll('.col').forEach(c=>c.classList.toggle('fora',+c.dataset.i!==i));
    dica(r.left+i*slot+slot/2,r.top+ph-(h[i]||0)/max*ph,`${fmt(h[i]||0)} ${h[i]===1?'visita':'visitas'}`,`Das ${i}h às ${(i+1)%24}h`);};
  const some=()=>{box.querySelectorAll('.col').forEach(c=>c.classList.remove('fora'));dica();};
  box.onpointermove=e=>{const r=box.getBoundingClientRect();mostra(Math.floor((e.clientX-r.left)/slot));};
  box.onpointerleave=some;box.onblur=some;box.onfocus=()=>mostra(box._i==null?h.indexOf(max):box._i);
  box.onkeydown=e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();mostra((box._i==null?0:box._i)+(e.key==='ArrowRight'?1:-1));}};
}

/* ---------- relatório de leads (PDF) ---------- */
let REP={p:'semana',de:'',ate:''};
function repIntervalo(){
  const fim=new Date();fim.setHours(23,59,59,999);const ini=new Date();
  if(REP.p==='dia'){ini.setHours(0,0,0,0);return {ini,fim,rotulo:'Hoje · '+ini.toLocaleDateString('pt-BR')};}
  if(REP.p==='semana'){ini.setTime(Date.now()-6*864e5);ini.setHours(0,0,0,0);return {ini,fim,rotulo:'Últimos 7 dias'};}
  if(REP.p==='mes'){ini.setTime(Date.now()-29*864e5);ini.setHours(0,0,0,0);return {ini,fim,rotulo:'Últimos 30 dias'};}
  if(!REP.de||!REP.ate)return null;
  const i=new Date(REP.de+'T00:00:00'),f=new Date(REP.ate+'T23:59:59');
  return {ini:i,fim:f,rotulo:'De '+i.toLocaleDateString('pt-BR')+' a '+f.toLocaleDateString('pt-BR')};
}
function repTroca(k){REP.p=k;if(k==='periodo'&&!REP.de){REP.de=new Date(Date.now()-6*864e5).toISOString().slice(0,10);REP.ate=hojeISO();}pintarRel();}
function pintarRel(animar){
  const iv=repIntervalo(),lista=iv?leadsRaw.filter(l=>{const d=new Date(l.criado_em);return d>=iv.ini&&d<=iv.fim;}):[],c=t=>lista.filter(l=>(l.tipo||'venda')===t).length;
  const num=n=>dadosProntos?`<b data-n="${n}">${animar?'0':fmt(n)}</b>`:'<b>&nbsp;</b>';
  const html=`<div class="rel-e"><div class="kk">Relatório de leads</div><div class="pps">${[['dia','Hoje'],['semana','7 dias'],['mes','30 dias'],['periodo','Período']].map(([k,t])=>`<button type="button" class="pp${REP.p===k?' on':''}" onclick="repTroca('${k}')">${t}</button>`).join('')}</div>
    ${REP.p==='periodo'?`<div class="rel-d"><input type="date" value="${REP.de}" aria-label="Do dia" onchange="REP.de=this.value;pintarRel()"> até <input type="date" value="${REP.ate}" aria-label="Até o dia" onchange="REP.ate=this.value;pintarRel()"></div>`:''}</div>
    <div class="rel-n"><div>${num(lista.length)}<span>Leads no total</span></div><div>${num(c('venda'))}<span>Interesse em carros</span></div><div>${num(c('compra'))}<span>Querem vender</span></div><div>${num(c('associacao'))}<span>Seja um associado</span></div></div>
    <button type="button" class="bt az" onclick="gerarRelatorio()">${sv(IC.baixar,'sm')}Baixar PDF</button>`;
  ['relDash','relLeads'].forEach(id=>{const e=$(id);if(!e)return;e.innerHTML=html;if(animar)e.querySelectorAll('b[data-n]').forEach((b,i)=>setTimeout(()=>contar(b,+b.dataset.n,1200),500+i*90));});
  // na visão geral, o relatório só aparece com os dados: antes, ele ficava em cima e descia quando as listas chegavam
  const d=$('relDash');
  if(!dadosProntos)d.hidden=true;

function imprimir(html){
  document.querySelectorAll('iframe.imprime').forEach(f=>f.remove());
  const f=document.createElement('iframe');f.className='imprime';f.setAttribute('aria-hidden','true');f.tabIndex=-1;
  f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;opacity:0;pointer-events:none';
  document.body.appendChild(f);
  const w=f.contentWindow,d=w.document;d.open();d.write(html);d.close();
  const vai=()=>{try{w.focus();w.print();}catch(e){toast('Não deu para abrir a impressão');}};
  // espera a letra e a logo carregarem (no máximo 2,5 s)
  const img=d.querySelector('img'),esperas=[d.fonts?d.fonts.ready:null,img&&!img.complete?new Promise(r=>{img.onload=img.onerror=r;}):null].filter(Boolean);
  Promise.race([Promise.all(esperas),new Promise(r=>setTimeout(r,2500))]).then(()=>setTimeout(vai,60));
  w.addEventListener('afterprint',()=>setTimeout(()=>f.remove(),500));
}

/* ---------- lista suspensa própria (o select do sistema não arredonda), com as animações dos filtros do site ---------- */
const setaBaixo='<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>';
function aprimorarSelect(sel){
  if(!sel)return null;
  if(sel.__dd){sel.__dd.atualizar();return sel.__dd;}
  const wrap=document.createElement('div');wrap.className='dd';
  sel.parentNode.insertBefore(wrap,sel);wrap.appendChild(sel);
  const t=document.createElement('button');t.type='button';t.className='dd-t';if(sel.getAttribute('aria-label'))t.setAttribute('aria-label',sel.getAttribute('aria-label'));
  // a lista fica no corpo da página, por cima de tudo: aberta no topo azul (o ramo do cadastro), ficava atrás da folha clara
  document.querySelectorAll('body>.dd-p').forEach(x=>{if(!x.__sel||!x.__sel.isConnected)x.remove();});   // as dos formulários que já saíram
  const p=document.createElement('div');p.className='dd-p';p.__sel=sel;wrap.__p=p;
  if(sel.dataset.tema==='escuro'){wrap.classList.add('esc');p.classList.add('esc');}   // no azul, a lista escura do site
  wrap.appendChild(t);document.body.appendChild(p);
  const api_={atualizar(animar){
    const w0=t.getBoundingClientRect().width,o0=sel.options[sel.selectedIndex];
    t.innerHTML='<span>'+esc(o0?o0.textContent:'')+'</span>'+setaBaixo;
    wrap.classList.toggle('marcado',sel.dataset.padrao!=null&&sel.value!==sel.dataset.padrao);
    p.innerHTML='';
    [...sel.options].forEach(o=>{const d=document.createElement('div');d.className='dd-o'+(o.value===sel.value?' sel':'');d.textContent=o.textContent;
      d.onclick=ev=>{ev.stopPropagation();const mudou=sel.value!==o.value;sel.value=o.value;fecharDd(wrap);api_.atualizar(mudou);if(mudou)sel.dispatchEvent(new Event('change',{bubbles:true}));};
      p.appendChild(d);});
    // escolhido: o botão vai do tamanho antigo ao novo e o texto novo surge (como os filtros do site)
    if(animar&&!reduz()&&w0){const w1=t.getBoundingClientRect().width;t.classList.remove('anda');void t.offsetWidth;t.classList.add('anda');
      if(Math.abs(w1-w0)>.5){t.style.overflow='hidden';t.animate([{width:w0+'px'},{width:w1+'px'}],{duration:420,easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish=()=>{t.style.overflow='';};}}
  }};
  t.onclick=ev=>{ev.stopPropagation();const abre=!wrap.classList.contains('on');fecharDds();if(abre){wrap.classList.add('on');p.classList.remove('sai');p.classList.add('on');ddFlutuar(t,p);}};
  p.onclick=ev=>ev.stopPropagation();
  sel.__dd=api_;api_.atualizar();return api_;
}
// fecha em fusão (a lista fica na tela enquanto some)
function fecharDd(w){if(!w.classList.contains('on'))return;const p=w.__p;w.classList.remove('on');if(!p)return;p.classList.remove('on');if(reduz())return;p.classList.add('sai');setTimeout(()=>p.classList.remove('sai'),150);}
function fecharDds(){document.querySelectorAll('.dd.on').forEach(fecharDd);}
// a lista abre presa à tela: nenhuma caixa com rolagem consegue cortá-la
function ddFlutuar(t,p){
  const r=t.getBoundingClientRect(),cabe=innerHeight-r.bottom>200;
  p.style.position='fixed';p.style.left=Math.min(r.left,innerWidth-Math.max(r.width,180)-8)+'px';p.style.minWidth=r.width+'px';p.style.zIndex=300;
  if(cabe){p.style.top=(r.bottom+6)+'px';p.style.bottom='auto';p.style.maxHeight=Math.min(300,innerHeight-r.bottom-16)+'px';p.style.transformOrigin='top left';}
  else{p.style.bottom=(innerHeight-r.top+6)+'px';p.style.top='auto';p.style.maxHeight=Math.min(300,r.top-16)+'px';p.style.transformOrigin='bottom left';}
}
// rolar ou mudar o tamanho reposiciona a lista em vez de fechar (o teclado do celular muda o tamanho)
['scroll','resize'].forEach(ev=>addEventListener(ev,e=>{
  if(e.target&&e.target.closest&&e.target.closest('.dd-p'))return;
  document.querySelectorAll('.dd.on').forEach(x=>{const t=x.querySelector('.dd-t'),p=x.__p;if(t&&p)ddFlutuar(t,p);});
},true));

/* ---------- logos das lojas ---------- */
// fundo branco; a logo de traço claro (letra branca) ganha o azul do site, e a de fundo próprio, a cor desse fundo.
// A cor escolhida à mão no painel manda em tudo. Logo pequena dentro da imagem é ampliada até preencher a caixa
const corLogoCache={};
function fundoDaLogo(img){
  const cx=img.parentNode;if(!cx)return;
  const manual=img.getAttribute('data-cor'),chave=(img.getAttribute('src')||'').slice(-90);
  if(corLogoCache[chave]!==undefined){aplicar(cx,img,corLogoCache[chave],manual);return;}
  let r={cor:null,escala:1};
  try{
    const N=32,c=document.createElement('canvas');c.width=N;c.height=N;
    const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(img,0,0,N,N);
    const d=g.getImageData(0,0,N,N).data,px=(x,y)=>{const i=(y*N+x)*4;return [d[i],d[i+1],d[i+2],d[i+3]];},lum=p=>(p[0]*299+p[1]*587+p[2]*114)/1000;
    const borda=[];for(let i=0;i<N;i++)borda.push(px(i,0),px(i,N-1),px(0,i),px(N-1,i));
    const opacos=borda.filter(p=>p[3]>200),temFundoProprio=opacos.length>borda.length*0.7;
    if(temFundoProprio){const m=opacos.reduce((a,p)=>[a[0]+p[0],a[1]+p[1],a[2]+p[2]],[0,0,0]).map(v=>Math.round(v/opacos.length));if(lum(m)<=232)r.cor='rgb('+m.join(',')+')';}
    else{
      // transparente: só escurece se o desenho for fino e claro (letra branca); bloco grande e claro é logo com fundo branco próprio
      let soma=0,n=0,x0b=N,y0b=N,x1b=-1,y1b=-1;
      for(let y=0;y<N;y++)for(let x=0;x<N;x++){const p=px(x,y);if(p[3]>200){soma+=lum(p);n++;if(x<x0b)x0b=x;if(y<y0b)y0b=y;if(x>x1b)x1b=x;if(y>y1b)y1b=y;}}
      const areaBloco=(x1b>x0b&&y1b>y0b)?((x1b-x0b+1)*(y1b-y0b+1))/(N*N):0,densidade=areaBloco?n/((x1b-x0b+1)*(y1b-y0b+1)):0;
      if(n&&soma/n>175&&!(areaBloco>0.70&&densidade>0.80))r.cor='#00091A';
    }
    let x0=N,y0=N,x1=-1,y1=-1;
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){const p=px(x,y),visivel=temFundoProprio?(Math.abs(lum(p)-lum(opacos[0]||[255,255,255,255]))>26):p[3]>60;
      if(visivel){if(x<x0)x0=x;if(y<y0)y0=y;if(x>x1)x1=x;if(y>y1)y1=y;}}
    if(x1>x0&&y1>y0){const ocupa=Math.max((x1-x0+1)/N,(y1-y0+1)/N);if(ocupa<0.82)r.escala=Math.min(1.45,0.92/ocupa);}
  }catch(e){/* imagem de outro domínio sem CORS: fica como está */}
  corLogoCache[chave]=r;aplicar(cx,img,r,manual);
}
function aplicar(cx,img,r,manual){
  const cor=manual||(r&&r.cor);
  if(cor){cx.style.background=cor;cx.style.boxShadow='none';}
  if(r&&r.escala>1.02){img.style.transform='scale('+r.escala.toFixed(2)+')';img.style.transformOrigin='center';}
}
const srcLogo=l=>(l.logo&&/^(data:|https?:|\/api\/)/.test(String(l.logo)))?l.logo:(L+(l.logo||l.chave+'_logo.png'));
const imgLogo=l=>`<img src="${esc(srcLogo(l))}" alt="" ${l.cor?`data-cor="${esc(l.cor)}"`:''} data-i="${esc(initials(l.nome))}" onload="fundoDaLogo(this)" onerror="this.parentNode.textContent=this.dataset.i">`;
const lgHtml=(l,g)=>`<span class="lg${g?' g':''}">${l.logo||l.chave?imgLogo(l):esc(initials(l.nome))}</span>`;

let logoData=null;   // data URI da logo escolhida no formulário (de uma loja ou de um credenciado)
function lerLogo(input,prevId){
  const f=input.files&&input.files[0];if(!f)return;
  const img=new Image(),fr=new FileReader();
  fr.onload=e=>{img.onload=()=>{
    const M=260,k=Math.min(1,M/img.width),c=document.createElement('canvas');
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    logoData=/png/i.test(f.type)?c.toDataURL('image/png'):c.toDataURL('image/jpeg',0.9);
    const prev=$(prevId);if(prev){prev.style.background='';prev.style.boxShadow='';prev.innerHTML=`<img src="${logoData}" alt="" onload="fundoDaLogo(this)">`;}
  };img.src=e.target.result;};
  fr.readAsDataURL(f);
}

/* ---------- a camada que abre embaixo da linha (Associados, Veículos e Leads), como em Associados no celular ---------- */
// fecha a que estava aberta (a página fecha como abriu) e abre a nova logo abaixo da linha tocada, de ponta a ponta. Na grade dos
// veículos, ela entra depois do último carro da fileira (ancora)
function abrirCamada(lista,linha,html,rolar,ancora){
  const rd=reduz(),tinha=lista.querySelector(':scope>.cam');
  // a que fecha perde os ids enquanto some: a nova tem os mesmos (as fotos do carro novo iam para a camada que estava fechando)
  lista.querySelectorAll(':scope>.cam').forEach(b=>{b.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));if(rd){b.remove();return;}b.style.overflow='hidden';
    b.animate([{height:b.offsetHeight+'px'},{height:'0px',paddingTop:'0px',paddingBottom:'0px'}],{duration:280,easing:'ease-in'}).onfinish=()=>b.remove();});
  lista.querySelectorAll(':scope>.on[data-k]').forEach(r=>{if(r!==linha){r.classList.remove('on');r.setAttribute('aria-expanded','false');}});
  if(!linha||!html)return null;
  linha.classList.add('on');linha.setAttribute('aria-expanded','true');
  const b=document.createElement('div');b.className='cam';b.innerHTML=`<div class="wrap">${html}</div>`;(ancora||linha).after(b);
  if(!rd){b.style.overflow='hidden';const h=b.offsetHeight;b.animate([{height:'0px',paddingTop:'0px',paddingBottom:'0px'},{height:h+'px'}],{duration:420,easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish=()=>{b.style.overflow='';};}
  if(rolar!==false)setTimeout(()=>{const x=linha.getBoundingClientRect();if(x.top<90||x.top>innerHeight*.5)scrollBy({top:x.top-100,behavior:rd?'auto':'smooth'});},rd?0:tinha?320:60);
  return b;
}
// a camada aberta, desenhada de novo junto com a lista (sem animar)
function reabrirCamada(lista,k,html,ancoraDe){
  const linha=lista.querySelector(`:scope>[data-k="${CSS.escape(String(k))}"]`);if(!linha||!html)return;
  linha.classList.add('on');linha.setAttribute('aria-expanded','true');
  const b=document.createElement('div');b.className='cam';b.innerHTML=`<div class="wrap">${html}</div>`;(ancoraDe?ancoraDe(lista,linha):linha).after(b);
}
// filtros em pílulas: com as mesmas opções, só a escolhida e as contas mudam (a troca anima em fusão); a lista entra em fusão
function pintarChips(box,itens,atual,fn){
  const k=itens.map(x=>x[0]).join('|');
  if(box.dataset.k===k&&box.children.length===itens.length){[...box.children].forEach((b,i)=>{b.classList.toggle('on',itens[i][0]===atual);const n=b.querySelector('i');if(n)n.textContent=itens[i][2];});return;}
  box.dataset.k=k;
  box.innerHTML=itens.map(x=>`<button type="button" class="chip${x[0]===atual?' on':''}${x[3]?' '+x[3]:''}" data-c="${esc(x[0])}" onclick="${fn}(this.dataset.c)">${esc(x[1])}<i>${x[2]}</i></button>`).join('');
}
const entrarLista=el=>{if(el&&!reduz())el.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:380,easing:'cubic-bezier(.2,.8,.2,1)'});};
// o cadastro e o editor do mural, no azul do topo: abrindo, o espaço cresce e o conteúdo surge; fechando, o conteúdo some primeiro e depois

function abrirBloco(b){b.hidden=false;if(reduz())return;b.style.overflow='hidden';const h=b.offsetHeight,mt=getComputedStyle(b).marginTop;
  b.animate([{height:'0px',marginTop:'0px',opacity:0},{height:h+'px',marginTop:mt,opacity:0,offset:.45},{height:h+'px',marginTop:mt,opacity:1}],{duration:620,easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish=()=>{b.style.overflow='';};}
function fecharBloco(b,depois){if(b.hidden){if(depois)depois();return;}
  const fim=()=>{b.hidden=true;b.innerHTML='';if(depois)depois();};
  if(reduz()){fim();return;}b.style.overflow='hidden';const h=b.offsetHeight,mt=getComputedStyle(b).marginTop;
  b.animate([{height:h+'px',marginTop:mt,opacity:1},{height:h+'px',marginTop:mt,opacity:0,offset:.3},{height:'0px',marginTop:'0px',opacity:0}],{duration:640,easing:'cubic-bezier(.45,0,.25,1)',fill:'forwards'}).onfinish=()=>{b.style.overflow='';fim();b.getAnimations().forEach(a=>a.cancel());};}

const VPOR=100;
let VPAG=0,veicFiltrados=[],VMODO=(()=>{try{return localStorage.getItem('painel_vmodo')||'grade';}catch(e){return 'grade';}})();
