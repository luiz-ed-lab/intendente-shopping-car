name: Vitrine da página inicial

# Todo dia escolhe as fotos da vitrine da home: só fotos perfeitas (carro inteiro, sem tarja,
# sem selo por cima). Grava vitrine.json no repositório quando muda, e a Vercel publica.
on:
  schedule:
    - cron: '30 10 * * *'   # 7h30 no Rio, depois do importador da Vercel (9h UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vitrine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # as ações de terceiros ficam presas ao commit exato (01/11/2026): uma etiqueta como "v4" pode ser trocada por quem controla a
      # ação, e este robô tem permissão de escrever no repositório. Para atualizar: o commit novo da etiqueta, com o nome dela no comentário
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install pillow==13.0.0 numpy==2.5.4
      - name: Escolher as fotos
        run: python .github/vitrine.py "https://intendente-shopping-car.vercel.app" vitrine.json
      - name: Gravar se mudou
        run: |
          if git diff --quiet -- vitrine.json; then echo "Nada mudou."; exit 0; fi
          git config user.name "vitrine-aceima"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vitrine.json
          git commit -m "Vitrine da home: fotos do dia"
          git pull --rebase
          git push
