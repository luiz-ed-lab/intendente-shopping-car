name: Verificar (testes e dependências)

# A cada envio para o site e toda segunda-feira (01/11/2026): roda os testes de testes/ e procura falha de segurança conhecida nas
# dependências da API (npm audit). Vermelho aqui é para olhar antes de publicar.
on:
  push:
    branches: [main, site-novo]
  schedule:
    - cron: '17 11 * * 1'   # segunda, 8h17 no Rio
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0   # o histórico inteiro, para o passo abaixo
      # Em 02/11/2026 o histórico foi reescrito para tirar a senha antiga do painel e o vídeo do modelo de terceiros. Uma cópia de antes
      # disso, juntada com git pull ou merge, traria tudo de volta: este commit só existe no histórico antigo
      - name: O histórico antigo não pode voltar
        run: |
          if git cat-file -e 3f6eab97c660e6aa9d66d6bd10923208e50b8e99^{commit} 2>/dev/null; then
            echo "::error::O histórico antigo voltou (um merge com uma cópia de antes de 02/11/2026). Desfaça o envio e baixe o repositório de novo."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: '22'
      - name: Dependências da API
        run: npm ci --ignore-scripts --no-fund
      - name: Falhas de segurança conhecidas nas dependências
        run: npm audit --omit=dev --audit-level=high
      - name: Testes
        run: for t in testes/*.mjs; do echo "== $t"; node "$t" || exit 1; done
