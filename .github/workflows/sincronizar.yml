name: Sincronizar estoque das lojas

# De 6 em 6 horas (pedido do Luiz, 02/11/2026: cada rodada acorda o banco, e o Neon grátis tem limite). Chama a nossa API uma loja por vez,
# para nenhuma chamada estourar o tempo limite da função. O GitHub atrasa e pula rodadas: quem garante as 6 horas é a visita ao site (rotaRefresh).
on:
  schedule:
    - cron: '17 3,9,15,21 * * *'   # 0h17, 6h17, 12h17 e 18h17 no Rio. Fora do começo da hora: ali o GitHub adia ou pula rodadas quando está cheio
  workflow_dispatch:

# este robô não mexe no repositório: nenhuma permissão para o token do GitHub (01/11/2026)
permissions: {}

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      # mesma senha do painel (variável PAINEL_TOKEN na Vercel).
      # cadastrar em: Settings > Secrets and variables > Actions > New repository secret
      PAINEL_TOKEN: ${{ secrets.PAINEL_TOKEN }}
    steps:
      - name: Ler as lojas e sincronizar uma por uma
        run: |
          SITE="https://intendente-shopping-car.vercel.app"
          if [ -z "$PAINEL_TOKEN" ]; then
            echo "AVISO: secret PAINEL_TOKEN não cadastrado neste repositório."
            echo "A API vai recusar a lista de lojas e a importação (401)."
          fi
          echo "Buscando lojas ativas..."
          # a lista completa das lojas pede a senha do painel desde 01/11/2026 (ela traz o e-mail que recebe os leads)
          IDS=$(curl -s --max-time 30 -H "x-painel-token: $PAINEL_TOKEN" "$SITE/api/lojas?path=lojas" \
                | grep -o '"id":[0-9]*' | cut -d: -f2)
          if [ -z "$IDS" ]; then
            echo "Nenhuma loja encontrada (API fora do ar ou senha errada?)."
            exit 0
          fi
          ler() {
            echo "--- Sincronizando loja $1"
            rm -f /tmp/out.json
            CODE=$(curl -s -o /tmp/out.json -w '%{http_code}' --max-time 90 \
                   -H "x-painel-token: $PAINEL_TOKEN" \
                   "$SITE/api/importar?path=importar&loja=$1" || echo "erro")
            echo "HTTP $CODE"
            head -c 400 /tmp/out.json 2>/dev/null || true
            echo ""
            [ "$CODE" = "200" ] && ! grep -q '"erro"' /tmp/out.json
          }
          FALHAS=""
          for ID in $IDS; do
            ler "$ID" || FALHAS="$FALHAS $ID"
            sleep 5
          done
          # a loja com falha na leitura sai do site (pedido do Luiz, 03/11/2026): antes disso, mais uma tentativa, para um tropeço de um minuto
          # no site dela não deixar a loja seis horas fora
          if [ -n "$FALHAS" ]; then
            echo "Tentando de novo, em 3 minutos:$FALHAS"
            sleep 180
            for ID in $FALHAS; do
              ler "$ID" || true
              sleep 5
            done
          fi
          # o site mostra o estoque novo na hora: o cache da lista é apagado uma vez, no fim da rodada (se alguma loja ainda estiver vencida, ela é lida antes)
          curl -s -o /dev/null --max-time 30 -H "x-painel-token: $PAINEL_TOKEN" "$SITE/api/refresh?path=refresh&seguir=1" || true
          echo "Sincronização concluída."
