# Avisa quando uma dependência da API ou uma ação do GitHub tem versão nova (01/11/2026). As de segurança chegam como pedido de
# mudança (pull request) logo que saem; as outras, uma vez por mês, juntas num pedido só.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencias:
        patterns: ['*']
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      acoes:
        patterns: ['*']
    open-pull-requests-limit: 2
