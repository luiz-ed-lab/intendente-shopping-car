<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#00091A">
<title>Repasse · Aceima</title>
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="32x32" href="marca-nova/icone-32.png">
<link rel="apple-touch-icon" href="marca-nova/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  Página de obra do Repasse (pedido do Luiz, 31/10/2026): fica em /repasse enquanto o Repasse está em construção.
  O Repasse de verdade (repasse.html) continua funcionando em /repasse-editar, fora do site e dos buscadores.
  Para tirar a obra, o /repasse volta a abrir o repasse.html no vercel.json.
-->
<style>
:root{--navy:#00091A;--gold:#C8862E;--gold3:#F4B05C;--ease:cubic-bezier(.2,.8,.2,1);--lado:60px;--f1:Outfit,sans-serif;--f2:Figtree,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--navy);-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100svh;background:var(--navy);color:#fff;font:16px/1.5 var(--f2);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
::selection{background:var(--gold3);color:var(--navy)}
:focus-visible{outline:2px solid var(--gold3);outline-offset:4px}

/* o vidro do site, discreto como no topo do Repasse, andando devagar na diagonal */
.vidro{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--navy);isolation:isolate;pointer-events:none}
.vidro::before{content:"";position:absolute;inset:-12%;background:url(fundo-animado-frame.jpg) center/cover no-repeat;opacity:.17;mix-blend-mode:screen;filter:brightness(.78);animation:deriva 38s ease-in-out infinite alternate}
@keyframes deriva{from{transform:translate3d(-5%,-4%,0)}to{transform:translate3d(5%,4%,0)}}

.obra{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px var(--lado);text-align:center}
.marca{display:flex;align-items:center;gap:14px;font:500 21px/1 var(--f1);color:var(--gold3);transition:opacity .2s}
.marca:hover{opacity:.85}
.marca img{display:block;height:30px;width:auto}
.marca i{width:1px;height:22px;background:rgba(255,255,255,.25)}
h1{margin-top:clamp(44px,7vh,72px);font:500 clamp(46px,6.4vw,96px)/1.02 var(--f1);letter-spacing:-.03em;text-wrap:balance}
h1 em{font-style:italic;color:var(--gold3)}

/* o fio dourado que se constrói e recomeça: a obra em andamento */
.fio{position:relative;display:block;width:clamp(120px,12vw,176px);height:2px;margin-top:clamp(30px,5vh,44px);border-radius:2px;background:rgba(244,176,92,.16);overflow:hidden}
.fio::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,var(--gold),var(--gold3));transform:scaleX(0);transform-origin:left;animation:obra 3.2s infinite}
@keyframes obra{
  0%{transform:scaleX(0);transform-origin:left;animation-timing-function:cubic-bezier(.16,1,.3,1)}
  50%{transform:scaleX(1);transform-origin:left}
  58%{transform:scaleX(1);transform-origin:right;animation-timing-function:cubic-bezier(.7,0,.84,0)}
  92%,100%{transform:scaleX(0);transform-origin:right}
}

.ouro{display:inline-flex;align-items:center;justify-content:center;height:46px;margin-top:clamp(34px,5.6vh,52px);padding:0 26px;border-radius:99px;background:linear-gradient(135deg,#C8862E,#F0AD57);color:#001128;font:600 15px/1.25 var(--f2);white-space:nowrap;transition:filter .2s,transform .2s var(--ease)}
.ouro:hover{filter:brightness(1.06)}
.ouro:active{transform:scale(.98)}

@media (max-width:760px){
  :root{--lado:5.63vw}
  .obra{padding:12vw var(--lado)}
  .marca{font-size:4.36vw;gap:2.56vw}.marca img{height:5.64vw}.marca i{height:4.6vw}
  h1{margin-top:11vw;font-size:11.6vw}
  .fio{width:30vw;margin-top:8vw}
  .ouro{height:11.3vw;margin-top:9vw;padding:0 6.4vw;font-size:3.6vw}
}
@media (prefers-reduced-motion:reduce){
  .vidro::before{animation:none}
  .fio::after{animation:none;transform:none}
  .ouro{transition:none}
}
</style>
</head>
<body>
<div class="vidro" aria-hidden="true"></div>
<main class="obra">
 <a class="marca" href="/" title="Site da Aceima"><img src="marca-nova/aceima-nova.png" alt="Aceima" width="1282" height="237"><i></i>Repasse</a>
 <h1>Opa!<br> Construção <em>em&nbsp;andamento.</em></h1>
 <span class="fio" aria-hidden="true"></span>
 <a class="ouro" href="/">Voltar para o site</a>
</main>
<script src="menu-fora.js"></script>
</body>
</html>
